<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Sinyal Paneli</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0f1220;
  --card:#1b1f38;
  --text:#e6e8ff;
  --muted:#9aa0ff;
  --green:#2ecc71;
  --red:#e74c3c;
  --yellow:#f1c40f;
  --blue:#3498db;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
body.light{
  --bg:#f4f6ff;
  --card:#ffffff;
  --text:#222;
  --muted:#666;
}
header{
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#11142a;
}
body.light header{background:#e9ecff}
.badge{
  padding:4px 10px;
  border-radius:20px;
  font-size:12px;
}
.green{background:var(--green);color:#000}
.red{background:var(--red)}
.yellow{background:var(--yellow);color:#000}

.container{padding:16px}
.filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:12px;
}
.filters label{
  background:var(--card);
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
}

/* Dikey kart düzeni */
.cards{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.card{
  background:var(--card);
  border-radius:12px;
  padding:12px;
  position:relative;
  word-break: break-word;
  width:100%;
  box-sizing:border-box;
}
.card b{font-size:20px}

.fav{
  position:absolute;
  top:8px;right:10px;
  cursor:pointer;
  font-size:18px;
  opacity:.4;
}
.fav.active{opacity:1;color:gold}

.tag{
  display:inline-block;
  padding:2px 8px;
  border-radius:10px;
  font-size:11px;
  margin-right:4px;
  margin-bottom:4px;
}

.l2{background:#2980b9}
.l3{background:#8e44ad}
.l4{background:#f39c12;color:#000}
.kombine{background:#27ae60}
.super_kombine{background:#e74c3c}
.pullback{background:#16a085}
.strong-buy{background:#2ecc71;color:#000}
.watch{background:#f1c40f;color:#000}
.order_block{background:#3498db}
.success{background:#9b59b6} 
.volume_ok{background:#2ecc71;color:#000}

.meta{
  font-size:13px;
  margin-top:6px;
  line-height:1.5;
}
.meta span{display:block;color:var(--muted)}

.trend-bar{
  height:6px;
  border-radius:6px;
  overflow:hidden;
  background:#333;
  margin-top:8px;
  display:flex;
}
.trend-up{background:var(--green)}
.trend-neutral{background:#777}
.trend-down{background:var(--red)}
</style>
</head>

<body>

<header>
  <div>
    Sistem: <span id="sys" class="badge">?</span>
    Piyasa: <span id="market" class="badge">?</span>
  </div>
  <button onclick="toggleTheme()">🌓</button>
</header>

<div class="container">

<div class="filters" id="filters">
  <label><input type="checkbox" value="favorites"> ⭐ Favoriler</label>
  <label><input type="checkbox" value="strong_buy"> 💚 Güçlü AL</label>
  <label><input type="checkbox" value="watch"> 👀 Takip Et</label>
  <label><input type="checkbox" value="success"> ✅ Başarılı Sinyaller</label>
  <label><input type="checkbox" value="kombine"> Kombine</label>
  <label><input type="checkbox" value="super_kombine"> Süper Kombine</label>
  <label><input type="checkbox" value="pullback"> Pullback</label>
  <label><input type="checkbox" value="trend_break"> 3’lü Tepe</label>
  <label><input type="checkbox" value="breakout"> Direnç Kırılımı</label>
  <label><input type="checkbox" value="order_block"> OB</label>
  <label><input type="checkbox" value="l2"> L2</label>
  <label><input type="checkbox" value="l3"> L3</label>
  <label><input type="checkbox" value="l4"> L4</label>
</div>

<div id="info"></div>
<div class="cards" id="cards"></div>

</div>

<script>
// JS kısmı aynen kalabilir, sadece render() fonksiyonunda dikey yapıya uygun şekilde bilgiler alt alta gösteriliyor
</script>

</body>
</html>
