<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Sinyal Paneli</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0f1220;
  --card:#1b1f38;
  --text:#e6e8ff;
  --muted:#9aa0ff;
  --green:#2ecc71;
  --red:#e74c3c;
  --yellow:#f1c40f;
  --blue:#3498db;
}
body{margin:0;font-family:Arial;background:var(--bg);color:var(--text)}
header{padding:12px 16px;display:flex;justify-content:space-between;background:#11142a}
.badge{padding:6px 12px;border-radius:12px;font-size:12px}
.green{background:var(--green);color:#000}
.red{background:var(--red)}
.yellow{background:var(--yellow);color:#000}

.container{padding:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.filter{background:var(--card);padding:6px 12px;border-radius:14px;font-size:12px;cursor:pointer}
.filter.active{border:1px solid var(--blue);box-shadow:0 0 6px var(--blue)}

.cards{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:14px;padding:14px;position:relative}

.action-tag{
  position:absolute;top:10px;right:10px;
  padding:4px 8px;border-radius:10px;
  font-size:12px;font-weight:bold;
  background:var(--yellow);color:#000
}

.success-tag{
  position:absolute;bottom:10px;right:10px;
  padding:4px 10px;border-radius:12px;
  font-size:11px;font-weight:bold;
  background:var(--green);color:#000;
}

.volume-strong{
  position:absolute;top:10px;left:10px;
  padding:4px 8px;border-radius:10px;
  font-size:11px;background:var(--green);color:#000;
  font-weight:bold;
}

.institutional-tag{
  position:absolute;
  bottom:10px;
  left:10px;
  padding:4px 10px;
  border-radius:12px;
  font-size:11px;
  font-weight:bold;
  background:#00cec9;
  color:#000;
}

.fav-btn{
  position:absolute;top:10px;right:55px;
  font-size:18px;cursor:pointer;
}

.algo-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.algo-tag{padding:3px 8px;border-radius:10px;font-size:11px;color:#000}

.algo-l2{background:#74b9ff}
.algo-l3{background:#0984e3}
.algo-l4{background:#6c5ce7}
.algo-breakout{background:#fdcb6e}
.algo-three_peak{background:#fab1a0}
.algo-ob{background:#55efc4}
.algo-kombine{background:#2ecc71}
.algo-super_kombine{background:#e84393}
.algo-squeeze{background:#81ecec}
.algo-squeeze_break{background:#d63031}

h2{margin:0;font-size:20px}
.price{font-size:13px;color:#aaa;margin-top:2px}
.meta{margin-top:8px;font-size:13px}
.meta span{display:block;color:var(--muted)}
.strength{margin-top:6px;font-size:12px;color:#fff}

.timebox{
  margin-top:8px;font-size:11px;color:#aaa;
  display:flex;justify-content:space-between;gap:10px;
}
.timebox div{line-height:1.4;text-align:right}
</style>
</head>

<body>

<header>
  <div>
    Sistem: <span id="sys" class="badge">?</span>
    Piyasa: <span id="market" class="badge">?</span>
    Son Tarama: <span id="scan" class="badge yellow">--:--:--</span>
  </div>
</header>

<div class="container">

<div class="filters">
  <div class="filter active" data-type="all">Tümü</div>
  <div class="filter" data-type="GÜÇLÜ AL">GÜÇLÜ AL</div>
  <div class="filter" data-type="success">BAŞARILI SİNYALLER</div>
  <div class="filter" data-type="favorite">⭐ FAVORİ</div>
  <div class="filter" data-type="kombine">KOMBİNE</div>
  <div class="filter" data-type="super_kombine">SÜPER KOMBİNE</div>
  <div class="filter" data-type="squeeze">🫧ÜÇGEN SIKIŞMA</div>
  <div class="filter" data-type="squeeze_break">💥 ÜÇGEN KIRILIM</div>
  <div class="filter" data-type="volume">GÜÇLÜ HACİM</div>
  <div class="filter" data-type="strengthened">GÜÇLENEN SİNYALLER</div>
  <div class="filter" data-type="institutional">🏦 KURUMSAL</div>
</div>

<div class="cards" id="cards"></div>
</div>

<script>
let allSignals=[];
let currentFilter="all";
let favorites=JSON.parse(localStorage.getItem("favorites")||"[]");

function toggleFavorite(symbol){
  favorites=favorites.includes(symbol)
    ?favorites.filter(x=>x!==symbol)
    :[...favorites,symbol];
  localStorage.setItem("favorites",JSON.stringify(favorites));
  render();
}

document.querySelectorAll(".filter").forEach(f=>{
  f.onclick=()=>{
    document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
    f.classList.add("active");
    currentFilter=f.dataset.type;
    render();
  };
});

function isInstitutional(s){
  return s.institutional_entry === true
    || (s.algorithms||[]).includes("ob");
}

function render(){
  const c=document.getElementById("cards");
  c.innerHTML="";

  allSignals.filter(s=>{
    if(currentFilter==="all")return true;
    if(currentFilter==="GÜÇLÜ AL")return s.action==="GÜÇLÜ AL";
    if(currentFilter==="success")return s.success;
    if(currentFilter==="favorite")return favorites.includes(s.symbol);
    if(currentFilter==="volume")return s.volume_tag==="GÜÇLÜ";
    if(currentFilter==="strengthened")return s.level_change;
    if(currentFilter==="kombine")return s.combined_type==="KOMBİNE";
    if(currentFilter==="super_kombine")return s.combined_type==="SÜPER KOMBİNE";
    if(currentFilter==="squeeze")return (s.algorithms||[]).includes("squeeze");
    if(currentFilter==="squeeze_break")return (s.algorithms||[]).includes("squeeze_break");
    if(currentFilter==="institutional")return isInstitutional(s);
    return true;
  }).forEach(s=>{
    const d=document.createElement("div");
    d.className="card";

    const algos=(s.algorithms||[])
      .map(a=>`<div class="algo-tag algo-${a}">${a}</div>`).join("");

    d.innerHTML=`
      ${s.volume_tag==="GÜÇLÜ"?`<div class="volume-strong">📊 GÜÇLÜ HACİM</div>`:""}
      ${s.success?`<div class="success-tag">🏆 BAŞARILI</div>`:""}
      ${isInstitutional(s)?`<div class="institutional-tag">🏦 KURUMSAL GİRİŞ</div>`:""}
      <div class="fav-btn" onclick="toggleFavorite('${s.symbol}')">
        ${favorites.includes(s.symbol)?"⭐":"☆"}
      </div>
      <div class="action-tag">${s.action}</div>
      <div class="algo-tags">${algos}</div>

      <h2>${s.symbol}</h2>
      <div class="price">Fiyat: ${s.current_price}</div>

      <div class="meta">
        <span>Trend: ${s.ema_trend}</span>
        <span>RSI 1h / 4h: ${s.rsi_1h} / ${s.rsi_4h}</span>
        <span>Direnç 1h / 4h: ${s.resistance_1h} / ${s.resistance_4h}</span>
      </div>

      <div class="strength">Güç Skoru: ${s.strength} / 10</div>

      <div class="timebox">
        <div>
          İlk: ${s.first_signal_time||"-"}<br>
          ${s.first_algorithms?s.first_algorithms.join(" "):""}
        </div>
        <div>
          Güçlenme: ${s.strengthen_time||"-"}<br>
          ${s.added_algorithms?s.added_algorithms.map(a=>"+"+a).join(" "):""}
        </div>
      </div>
    `;
    c.appendChild(d);
  });
}

async function update(){
  const r=await fetch("/api");
  const d=await r.json();
  allSignals=d.signals||[];
  document.getElementById("sys").textContent=d.system_active?"Aktif":"Kapalı";
  document.getElementById("sys").className="badge "+(d.system_active?"green":"red");
  document.getElementById("market").textContent=d.market_open?"Açık":"Kapalı";
  document.getElementById("market").className="badge "+(d.market_open?"green":"yellow");

  // Last scan fix: parse "YYYY-MM-DD HH:MM:SS" correctly
  let lastScanDisplay="--:--:--";
  if(d.last_scan){
    let dt=new Date(d.last_scan.replace(" ","T"));
    if(!isNaN(dt)) lastScanDisplay=dt.toLocaleTimeString("tr-TR",{hour12:false});
  }
  document.getElementById("scan").textContent=lastScanDisplay;

  render();
}

update();
setInterval(update,5000);
</script>
</body>
</html>
