<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Profesyonel BIST Sinyal Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d1117;
  --card:#161b22;
  --text:#e6edf3;
  --muted:#8b949e;
  --green:#2ea043;
  --red:#f85149;
  --blue:#1f6feb;
  --gold:#d29922;
  --purple:#8957e5;
  --border:#21262d;
}
body.light{
  --bg:#f6f8fa;
  --card:#ffffff;
  --text:#24292f;
  --muted:#57606a;
  --border:#d0d7de;
}
*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);transition:.3s}

/* NAVBAR */
.navbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);
}
.status{display:flex;gap:14px;font-size:13px}
.badge{padding:4px 8px;border-radius:6px;font-weight:600}
.green{background:var(--green);color:#fff}
.red{background:var(--red);color:#fff}
.yellow{background:var(--gold);color:#000}

/* FILTERS */
.filters{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);
}
.filters label{
  font-size:12px;cursor:pointer;color:var(--muted);
  background:var(--bg);padding:6px 10px;border-radius:8px;border:1px solid var(--border);
}

/* INFO */
.info-bar{padding:10px 16px;font-size:13px;color:var(--muted)}

/* CARDS */
#cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;padding:16px;
}
.card{
  background:linear-gradient(180deg,var(--card),var(--bg));
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  transition:.25s;
  position:relative;
}
.card:hover{transform:translateY(-4px)}
.fav{
  position:absolute;top:10px;right:12px;
  cursor:pointer;font-size:18px;
}
.fav.active{color:gold}

.tag{font-size:11px;padding:3px 6px;border-radius:6px;background:var(--border)}
.tag.l3,.tag.l4,.tag.ob{background:var(--purple);color:#fff}
.tag.target{background:var(--green);color:#000}
</style>
</head>

<body>

<div class="navbar">
  <div class="status">
    <div>Sistem: <span id="sys" class="badge yellow">--</span></div>
    <div>Piyasa: <span id="market" class="badge yellow">--</span></div>
    <div>Son Tarama: <b id="scan">--:--:--</b></div>
  </div>
  <button onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<div class="filters" id="filters">
  <label><input type="checkbox" value="favorites"> ⭐ Favoriler</label>

  <label><input type="checkbox" value="buy" checked> AL</label>
  <label><input type="checkbox" value="sell" checked> SAT</label>
  <label><input type="checkbox" value="pullback"> Pullback</label>
  <label><input type="checkbox" value="strong_reversal"> Güçlü Dönüş</label>
  <label><input type="checkbox" value="trend_break"> Trend Kırılımı</label>
  <label><input type="checkbox" value="breakout"> Direnç Kırılımı</label>
  <label><input type="checkbox" value="rsi"> RSI</label>
  <label><input type="checkbox" value="kombine"> Kombine</label>
  <label><input type="checkbox" value="super_kombine"> Süper Kombine</label>

  <label><input type="checkbox" value="l2"> L2 (Orta Trend)</label>
  <label><input type="checkbox" value="l3"> L3 (Güçlü Trend)</label>
  <label><input type="checkbox" value="l4"> L4 (Smart Money)</label>
  <label><input type="checkbox" value="ob"> OB (Kurumsal Alım)</label>
</div>

<div class="info-bar" id="info">Veri bekleniyor...</div>
<div id="cards"></div>

<script>
let ALL_SIGNALS=[]
let favs=JSON.parse(localStorage.getItem("favs")||"[]")

function toggleFav(sym){
  favs = favs.includes(sym) ? favs.filter(x=>x!==sym) : [...favs,sym]
  localStorage.setItem("favs",JSON.stringify(favs))
  render()
}

function activeFilters(){
  return [...document.querySelectorAll(".filters input:checked")].map(i=>i.value)
}

function render(){
  const wrap=document.getElementById("cards")
  wrap.innerHTML=""
  const f=activeFilters()

  let data=ALL_SIGNALS.filter(s=>{
    if(f.includes("favorites") && !favs.includes(s.symbol)) return false
    if(f.some(x=>["l2","l3","l4","ob"].includes(x))){
      if(!f.includes((s.details?.level||"").toLowerCase())
         && !(s.type==="order_block" && f.includes("ob"))) return false
    }
    return true
  })

  if(!data.length){info.textContent="Sinyal yok";return}
  info.textContent=data.length+" sinyal"

  data.forEach(s=>{
    const c=document.createElement("div")
    c.className="card"
    c.innerHTML=`
      <div class="fav ${favs.includes(s.symbol)?"active":""}"
           onclick="toggleFav('${s.symbol}')">★</div>
      <b>${s.symbol}</b><br>
      ${s.title}<br>
      <div class="tag ${(s.details?.level||'').toLowerCase()}">
        ${s.details?.level||""}
      </div>
    `
    wrap.appendChild(c)
  })
}

async function load(){
  const r=await fetch("/api")
  const j=await r.json()
  sys.textContent=j.system_active?"AKTİF":"PASİF"
  market.textContent=j.market_open?"AÇIK":"KAPALI"
  if(j.last_scan)scan.textContent=new Date(j.last_scan*1000).toLocaleTimeString()
  ALL_SIGNALS=j.signals||[]
  render()
}

document.getElementById("filters").addEventListener("change",render)
setInterval(load,5000);load()
</script>
</body>
</html>
