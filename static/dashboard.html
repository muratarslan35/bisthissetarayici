<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Profesyonel Sinyal Paneli</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #0e1117;
  --card: #161b22;
  --text: #e6edf3;
  --green: #00c853;
  --red: #ff5252;
  --yellow: #ffb300;
  --border: #30363d;
}

.light {
  --bg: #f5f7fa;
  --card: #ffffff;
  --text: #111;
  --border: #ddd;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  padding: 15px;
  background: var(--card);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border);
}

h1 {
  font-size: 18px;
}

button {
  padding: 6px 10px;
  cursor: pointer;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}

.filters label {
  font-size: 13px;
}

.container {
  padding: 15px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 15px;
}

.card {
  background: var(--card);
  padding: 15px;
  border-radius: 10px;
  border: 1px solid var(--border);
}

.symbol {
  font-size: 18px;
  font-weight: bold;
}

.tag {
  display: inline-block;
  padding: 3px 8px;
  margin: 3px 3px 0 0;
  border-radius: 6px;
  font-size: 12px;
}

.green { background: var(--green); color: #fff; }
.red { background: var(--red); color: #fff; }
.yellow { background: var(--yellow); color: #000; }

small {
  opacity: 0.8;
}
</style>
</head>

<body>

<header>
  <h1>📊 BIST Canlı Bist Tarama Paneli</h1>
  <button onclick="toggleTheme()">🌗 Tema</button>
</header>

<div class="filters">
  <label><input type="checkbox" id="f_al"> AL</label>
  <label><input type="checkbox" id="f_sat"> SAT</label>
  <label><input type="checkbox" id="f_combo"> Kombine</label>
  <label><input type="checkbox" id="f_super"> Süper Kombine</label>
  <label><input type="checkbox" id="f_three"> 3'lü Tepe</label>
  <label><input type="checkbox" id="f_support"> Destek Kırılımı</label>
  <label><input type="checkbox" id="f_resistance"> Direnç Kırılımı</label>
</div>

<div class="container" id="list"></div>

<script>
let dark = true;

function toggleTheme() {
  dark = !dark;
  document.body.className = dark ? "" : "light";
}

async function loadData() {
  try {
    const res = await fetch("/api");
    const json = await res.json();
    const data = json.data || [];
    render(data);
  } catch (e) {
    console.error(e);
  }
}

function render(data) {
  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(item => {

    if (document.getElementById("f_al").checked && item.last_signal !== "AL") return;
    if (document.getElementById("f_sat").checked && item.last_signal !== "SAT") return;
    if (document.getElementById("f_combo").checked && !item.composite_signal) return;
    if (document.getElementById("f_super").checked && !item.super_combo) return;
    if (document.getElementById("f_three").checked && !item.three_peak_break) return;
    if (document.getElementById("f_support").checked && !item.support_break) return;
    if (document.getElementById("f_resistance").checked && !item.resistance_break) return;

    const c = document.createElement("div");
    c.className = "card";

    let tags = "";

    if (item.last_signal === "AL") tags += `<span class="tag green">AL</span>`;
    if (item.last_signal === "SAT") tags += `<span class="tag red">SAT</span>`;
    if (item.composite_signal) tags += `<span class="tag yellow">KOMBİNE</span>`;
    if (item.super_combo) tags += `<span class="tag yellow">SÜPER</span>`;
    if (item.three_peak_break) tags += `<span class="tag red">3'lü Tepe</span>`;
    if (item.support_break) tags += `<span class="tag green">Destek</span>`;
    if (item.resistance_break) tags += `<span class="tag red">Direnç</span>`;

    c.innerHTML = `
      <div class="symbol">${item.symbol}</div>
      ${tags}
      <p>💰 Fiyat: ${item.current_price}</p>
      <p>📈 Trend: ${item.trend}</p>
      <p>📊 RSI: ${item.RSI}</p>
      <p>📦 Hacim: ${item.volume}</p>
      <small>🕒 ${item.signal_time || ""}</small>
    `;

    list.appendChild(c);
  });
}

setInterval(loadData, 30000);
loadData();
</script>

</body>
</html>
