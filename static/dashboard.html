<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Sinyal Paneli</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  background: #0e1117;
  color: #e6edf3;
  font-family: Arial;
}
header {
  background: #010409;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.badge {
  padding: 6px 10px;
  border-radius: 6px;
  font-weight: bold;
}
.green { background: #2ea043; }
.red { background: #f85149; }
.yellow { background: #d29922; }

.container { padding: 16px; }

.card {
  background: #161b22;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 12px;
}
</style>
</head>

<body>

<header>
  <b>Yakında Zengin Edecek Sinyaller</b>
  <button onclick="wake()" class="badge yellow">
    Sistemi Uyandır (Sunucuyu Ayakta Tut)
  </button>
</header>

<div class="container">

  <div class="card">
    <div>
      Sistem Durumu:
      <span id="sys" class="badge yellow">Kontrol ediliyor</span>
    </div>
    <div style="margin-top:6px">
      Tarama Durumu:
      <span id="scan" class="badge yellow">Bekleniyor</span>
    </div>
  </div>

  <div id="signals"></div>

</div>

<script>
async function wake() {
  await fetch("/wake");
  alert("Sistem uyandırıldı (tarama sıfırlanmadı)");
}

async function load() {
  const res = await fetch("/api");
  const j = await res.json();

  const now = Date.now() / 1000;

  // SYSTEM STATUS
  const sys = document.getElementById("sys");
  if (j.system_active) {
    sys.textContent = "AKTİF (Sunucu Çalışıyor)";
    sys.className = "badge green";
  } else {
    sys.textContent = "PASİF";
    sys.className = "badge red";
  }

  // SCAN STATUS
  const scan = document.getElementById("scan");
  if (j.last_scan && (now - j.last_scan) < 180) {
    scan.textContent = "TARAMA AKTİF";
    scan.className = "badge green";
  } else {
    scan.textContent = "BEKLEME / PİYASA KAPALI";
    scan.className = "badge yellow";
  }

  // SIGNALS
  const box = document.getElementById("signals");
  box.innerHTML = "";

  (j.data || []).forEach(s => {
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `
      <b>${s.symbol}</b><br>
      Fiyat: ${s.current_price ?? "-"}<br>
      RSI: ${s.rsi_15 ?? "-"}<br>
      Sinyal: ${s.last_signal ?? "-"}
    `;
    box.appendChild(c);
  });
}

setInterval(load, 5000);
load();
</script>

</body>
</html>
