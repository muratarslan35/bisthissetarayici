<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Sinyal Paneli</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0f1220;
  --card:#1b1f38;
  --text:#e6e8ff;
  --muted:#9aa0ff;
  --green:#2ecc71;
  --red:#e74c3c;
  --yellow:#f1c40f;
}
body{margin:0;font-family:Arial;background:var(--bg);color:var(--text)}
body.light{--bg:#f4f6ff;--card:#fff;--text:#222;--muted:#666}

header{
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#11142a;
}
body.light header{background:#e9ecff}

.badge{padding:4px 10px;border-radius:20px;font-size:12px}
.green{background:var(--green);color:#000}
.red{background:var(--red)}
.yellow{background:var(--yellow);color:#000}

.container{padding:16px}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:14px;
}
.filters label{
  background:var(--card);
  padding:6px 10px;
  border-radius:10px;
  font-size:12px;
  cursor:pointer;
}

.cards{display:flex;flex-direction:column;gap:14px}

.card{
  background:var(--card);
  border-radius:14px;
  padding:14px;
}

h2{margin:0;font-size:20px;display:flex;flex-wrap:wrap;gap:8px}

.tag{padding:2px 8px;border-radius:10px;font-size:11px}
.success{background:#9b59b6}
.volume_ok{background:#2ecc71;color:#000}
.watch{background:#f1c40f;color:#000}
.strong{background:#2ecc71;color:#000}

.meta{margin-top:10px;font-size:13px;line-height:1.6}
.meta span{display:block;color:var(--muted)}

.algos{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.15)}
.algobox{margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.06);font-size:12px}
</style>
</head>

<body>

<header>
  <div>
    Sistem: <span id="sys" class="badge">?</span>
    Piyasa: <span id="market" class="badge">?</span>
  </div>
  <button onclick="toggleTheme()">🌓</button>
</header>

<div class="container">

  <!-- FİLTRELER -->
  <div class="filters">
    <label><input type="checkbox" data-filter="strong"> Güçlü AL</label>
    <label><input type="checkbox" data-filter="watch"> Takip</label>
    <label><input type="checkbox" data-filter="success"> Başarılı</label>
    <label><input type="checkbox" data-filter="volume"> Hacim</label>
    <label><input type="checkbox" data-filter="kombine"> Kombine</label>
    <label><input type="checkbox" data-filter="super"> Süper Kombine</label>
    <label><input type="checkbox" data-filter="ob"> OB</label>
    <label><input type="checkbox" data-filter="rsi"> RSI</label>
    <label><input type="checkbox" data-filter="support"> Destek</label>
    <label><input type="checkbox" data-filter="resistance"> Direnç</label>
    <label><input type="checkbox" data-filter="break"> Kırılım</label>
    <label><input type="checkbox" data-filter="triple"> 3’lü Tepe</label>
    <label><input type="checkbox" data-filter="l2"> L2</label>
    <label><input type="checkbox" data-filter="l3"> L3</label>
    <label><input type="checkbox" data-filter="l4"> L4</label>
  </div>

  <div class="cards" id="cards"></div>
</div>

<script>
let lastScan=0, allSignals=[];

setInterval(async()=>{
  const res=await fetch("/api");
  const data=await res.json();

  const sys=document.getElementById("sys");
  sys.textContent=data.system_active?"Aktif":"Pasif";
  sys.className="badge "+(data.system_active?"green":"red");

  const m=document.getElementById("market");
  m.textContent=data.market_open?"Açık":"Kapalı";
  m.className="badge "+(data.market_open?"green":"yellow");

  allSignals=data.signals;
  render();
},10000);

document.querySelectorAll(".filters input").forEach(i=>{
  i.addEventListener("change",render);
});

function render(){
  const active=[...document.querySelectorAll(".filters input:checked")].map(i=>i.dataset.filter);
  const cards=document.getElementById("cards");
  cards.innerHTML="";

  allSignals.filter(s=>{
    return active.every(f=>{
      if(f==="strong") return s.action==="GÜÇLÜ AL";
      if(f==="watch") return s.action!=="GÜÇLÜ AL";
      if(f==="success") return s.success;
      if(f==="volume") return s.volume_badge;
      if(f==="kombine") return s.combined_algorithms?.length;
      if(f==="super") return s.super_combined;
      if(f==="ob") return s.has_ob;
      if(f==="rsi") return s.rsi;
      if(f==="support") return s.support_15m;
      if(f==="resistance") return s.resistance_15m;
      if(f==="break") return s.breakout;
      if(f==="triple") return s.triple_top;
      if(f==="l2") return s.l2;
      if(f==="l3") return s.l3;
      if(f==="l4") return s.l4;
      return true;
    });
  }).forEach(sig=>{
    const d=document.createElement("div");
    d.className="card";
    d.innerHTML=`<h2>${sig.symbol}</h2>`;
    cards.appendChild(d);
  });
}

function toggleTheme(){document.body.classList.toggle("light")}
</script>

</body>
</html>
