<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Sinyal Paneli</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#0f1220;
  --card:#1b1f38;
  --text:#e6e8ff;
  --muted:#9aa0ff;
  --green:#2ecc71;
  --red:#e74c3c;
  --yellow:#f1c40f;
  --blue:#3498db;
}
body{margin:0;font-family:Arial;background:var(--bg);color:var(--text)}
header{padding:12px 16px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;background:#11142a;gap:6px}
.badge{padding:6px 12px;border-radius:12px;font-size:12px;transition:0.2s}
.badge.green{background:var(--green);color:#000}
.badge.red{background:var(--red)}
.badge.yellow{background:var(--yellow);color:#000}

.container{padding:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;justify-content:center}
.filter{background:var(--card);padding:6px 12px;border-radius:14px;font-size:12px;cursor:pointer;white-space:nowrap;transition:0.2s}
.filter:hover{box-shadow:0 0 6px var(--blue)}
.filter.active{border:1px solid var(--blue);box-shadow:0 0 6px var(--blue)}

.cards{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:14px;padding:14px;position:relative;transition:0.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 0 12px rgba(0,0,0,0.5)}

.action-tag{position:absolute;top:10px;right:10px;padding:4px 8px;border-radius:10px;font-size:12px;font-weight:bold;background:var(--yellow);color:#000}
.success-tag{position:absolute;bottom:10px;right:10px;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold;background:var(--green);color:#000}
.volume-strong{position:absolute;top:10px;left:10px;padding:4px 8px;border-radius:10px;font-size:11px;background:var(--green);color:#000;font-weight:bold}
.institutional-tag{position:absolute;bottom:10px;left:10px;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold;background:#00cec9;color:#000}
.fav-btn{position:absolute;top:10px;right:55px;font-size:18px;cursor:pointer}
.algo-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.algo-tag{padding:3px 8px;border-radius:10px;font-size:11px;color:#000;white-space:nowrap}
.algo-l2{background:#0984e3}
.algo-l3{background:#6c5ce7}
.algo-l4{background:#fdcb6e}
.algo-three_peak{background:#fd79a8}
.algo-order_block{background:#d63031}
.algo-squeeze{background:#81ecec}
.algo-squeeze_break{background:#d63031}
.algo-kombine{background:#2ecc71}
.algo-super_kombine{background:#e84393}

h2{margin:0;font-size:20px}
.price{font-size:13px;color:#aaa;margin-top:2px}
.meta{margin-top:8px;font-size:13px}
.meta span{display:block;color:var(--muted)}
.strength{margin-top:6px;font-size:12px;color:#fff;font-weight:bold}
.timebox{margin-top:8px;font-size:11px;color:#aaa;display:flex;justify-content:space-between;gap:10px}
.timebox div{line-height:1.4;text-align:right}
</style>
</head>

<body>
<header>
  <div>
    Sistem: <span id="sys" class="badge">?</span>
    Piyasa: <span id="market" class="badge">?</span>
    Son Tarama: <span id="scan" class="badge yellow">--:--:--</span>
  </div>
</header>

<div class="container">
<div class="filters">
  <div class="filter active" data-type="all">Tümü</div>
  <div class="filter" data-type="GÜÇLÜ AL">GÜÇLÜ AL 📈</div>
  <div class="filter" data-type="success">BAŞARILI 🏆</div>
  <div class="filter" data-type="favorite">⭐ FAVORİ</div>
  <div class="filter" data-type="kombine">KOMBİNE ⚡</div>
  <div class="filter" data-type="super_combined">SÜPER KOMBİNE 🔥</div>
  <div class="filter" data-type="squeeze">🫧 ÜÇGEN SIKIŞMA</div>
  <div class="filter" data-type="squeeze_break">💥 ÜÇGEN KIRILIM</div>
  <div class="filter" data-type="volume">GÜÇLÜ HACİM 📊</div>
  <div class="filter" data-type="strengthened">GÜÇLENEN ⚡</div>
  <div class="filter" data-type="institutional">🏦 KURUMSAL</div>
</div>

<div class="cards" id="cards"></div>
</div>

<script>
let allSignals = [];
let currentFilter = "all";
let favorites = JSON.parse(localStorage.getItem("favorites")||"[]");
let lastScanTime = null;
let scanDisplay = document.getElementById("scan");
let notifiedSymbols = new Set();

if("Notification" in window && Notification.permission==="default"){
  Notification.requestPermission();
}

function toggleFavorite(symbol){
  favorites = favorites.includes(symbol)
    ? favorites.filter(x=>x!==symbol)
    : [...favorites,symbol];
  localStorage.setItem("favorites",JSON.stringify(favorites));
  render();
}

document.querySelectorAll(".filter").forEach(f=>{
  f.onclick=()=>{
    document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
    f.classList.add("active");
    currentFilter=f.dataset.type;
    render();
  };
});

function isInstitutional(s){
  return (s.algorithms||[]).includes("order_block");
}

function render(){
  const c = document.getElementById("cards");
  c.innerHTML = "";

  const filtered = allSignals.filter(s=>{
    switch(currentFilter){
      case "all": return true;
      case "GÜÇLÜ AL": return s.action==="GÜÇLÜ AL";
      case "success": return s.success;
      case "favorite": return favorites.includes(s.symbol);
      case "volume": return s.volume_tag==="GÜÇLÜ";
      case "strengthened": return s.level_change;
      case "kombine": return (s.algorithms||[]).includes("kombine");
      case "super_combined": return (s.algorithms||[]).includes("super_kombine");
      case "squeeze": return (s.algorithms||[]).includes("squeeze");
      case "squeeze_break": return (s.algorithms||[]).includes("squeeze_break");
      case "institutional": return isInstitutional(s);
      default: return true;
    }
  });

  filtered.forEach(s=>{
    const d = document.createElement("div");
    d.className = "card";

    const algos = (s.algorithms||[]).map(a=>{
      const names = {
        l2:"EMA Trend 📈",
        l3:"Destek / Direnç 🛡️",
        l4:"Breakout 🚀",
        three_peak:"Üç Zirve 🔺",
        order_block:"Emir Bloğu 📦",
        squeeze:"Üçgen Sıkışma 🫧",
        squeeze_break:"Üçgen Kırılım 💥",
        kombine:"Kombine ⚡",
        super_kombine:"Süper KOMBİNE 🔥"
      };
      return `<div class="algo-tag algo-${a}">${names[a]||a}</div>`;
    }).join("");

    d.innerHTML = `
      ${s.volume_tag==="GÜÇLÜ"?`<div class="volume-strong">📊 GÜÇLÜ HACİM</div>`:""}
      ${s.success?`<div class="success-tag">🏆 BAŞARILI</div>`:""}
      ${isInstitutional(s)?`<div class="institutional-tag">🏦 KURUMSAL</div>`:""}
      <div class="fav-btn" onclick="toggleFavorite('${s.symbol}')">
        ${favorites.includes(s.symbol)?"⭐":"☆"}
      </div>
      <div class="action-tag">${s.action||""}</div>
      <div class="algo-tags">${algos}</div>

      <h2>${s.symbol}</h2>
      <div class="price">Fiyat: ${s.current_price||"-"}</div>

      <div class="meta">
        <span>Trend: ${s.ema_trend||"-"}</span>
        <span>RSI 1h / 4h: ${s.rsi_1h||"-"} / ${s.rsi_4h||"-"}</span>
        <span>Direnç 1h / 4h: ${s.resistance_1h||"-"} / ${s.resistance_4h||"-"}</span>
      </div>

      <div class="strength">Güç Skoru: ${s.strength||"-"} / 10</div>

      <div class="timebox">
        <div>
          İlk: ${s.first_signal_time||"-"}<br>
          ${(s.first_algorithms||[]).map(a=>{
            const names = {
              l2:"EMA Trend 📈",
              l3:"Destek / Direnç 🛡️",
              l4:"Breakout 🚀",
              three_peak:"Üç Zirve 🔺",
              order_block:"Emir Bloğu 📦",
              squeeze:"Üçgen Sıkışma 🫧",
              squeeze_break:"Üçgen Kırılım 💥",
              kombine:"Kombine ⚡",
              super_kombine:"Süper KOMBİNE 🔥"
            };
            return names[a]||a;
          }).join(" ")}
        </div>
        <div>
          Güçlenme: ${s.strengthen_time||"-"}<br>
          ${(s.added_algorithms||[]).map(a=>{
            const names = {
              l2:"EMA Trend 📈",
              l3:"Destek / Direnç 🛡️",
              l4:"Breakout 🚀",
              three_peak:"Üç Zirve 🔺",
              order_block:"Emir Bloğu 📦",
              squeeze:"Üçgen Sıkışma 🫧",
              squeeze_break:"Üçgen Kırılım 💥",
              kombine:"Kombine ⚡",
              super_kombine:"Süper KOMBİNE 🔥"
            };
            return `+${names[a]||a}`;
          }).join(" ")}
        </div>
      </div>
    `;
    c.appendChild(d);

    if(s.action==="GÜÇLÜ AL" && !notifiedSymbols.has(s.symbol)){
      if(Notification.permission==="granted"){
        new Notification("📈 GÜÇLÜ AL Sinyali", {
          body: `${s.symbol} için yeni GÜÇLÜ AL sinyali geldi!`,
          icon: "/favicon.ico"
        });
      }
      notifiedSymbols.add(s.symbol);
    }
  });
}

async function updateAPI(){
  try{
    const r = await fetch("/api");
    const d = await r.json();
    allSignals = d.signals || [];
    const sysBadge = document.getElementById("sys");
    sysBadge.textContent = d.system_active ? "Aktif" : "Kapalı";
    sysBadge.className = "badge " + (d.system_active ? "green" : "red");

    const marketBadge = document.getElementById("market");
    marketBadge.textContent = d.market_open ? "Açık" : "Kapalı";
    marketBadge.className = "badge " + (d.market_open ? "green" : "yellow");

    if(d.last_scan){
      lastScanTime = new Date(d.last_scan.replace(" ","T")).getTime();
    }

    render();
  }catch(e){
    console.error("API fetch error", e);
  }
}

function updateClock(){
  if(lastScanTime){
    const now = Date.now();
    const display = new Date(lastScanTime + (now - lastScanTime)).toLocaleTimeString("tr-TR",{hour12:false});
    scanDisplay.textContent = display;
  }
}

updateAPI();
setInterval(updateAPI,5000);
setInterval(updateClock,1000);
</script>
</body>
</html>
