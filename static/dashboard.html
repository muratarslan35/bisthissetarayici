<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Profesyonel BIST Sinyal Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d1117;
  --card:#161b22;
  --text:#e6edf3;
  --muted:#8b949e;
  --green:#2ea043;
  --red:#f85149;
  --gold:#d29922;
  --border:#21262d;
}
body.light{
  --bg:#f6f8fa;
  --card:#ffffff;
  --text:#24292f;
  --muted:#57606a;
  --border:#d0d7de;
}
*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);transition:.3s}

/* NAVBAR */
.navbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);
}
.status{display:flex;gap:14px;font-size:13px}
.badge{padding:4px 8px;border-radius:6px;font-weight:600}
.green{background:var(--green);color:#fff}
.red{background:var(--red);color:#fff}
.yellow{background:var(--gold);color:#000}

/* FILTERS */
.filters{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);
}
.filters label{
  font-size:12px;cursor:pointer;color:var(--muted);
  background:var(--bg);padding:6px 10px;border-radius:8px;border:1px solid var(--border);
}

/* INFO */
.info-bar{padding:10px 16px;font-size:13px;color:var(--muted)}

/* CARDS */
#cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;padding:16px;
}
.card{
  background:linear-gradient(180deg,var(--card),var(--bg));
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  transition:.25s;
  position:relative;
}
.card:hover{transform:translateY(-4px)}
.fav{
  position:absolute;top:10px;right:12px;
  cursor:pointer;font-size:18px;color:var(--muted);
}
.fav.active{color:gold}

/* TAGS */
.tag{
  font-size:11px;padding:3px 6px;border-radius:6px;
  background:var(--border);display:inline-block;margin-right:4px;margin-top:4px;
}
.tag.l2{background:#6c5dd3;color:#fff}
.tag.l3{background:#7dd3fc;color:#000}
.tag.l4{background:#f9a8d4;color:#000}
.tag.kombine{background:#facc15;color:#000}
.tag.super_kombine{background:#34d399;color:#000}

/* TREND BAR */
.trend-bar{
  display:flex;height:6px;margin-top:6px;
  border-radius:3px;overflow:hidden;background:var(--border);
}
.trend-up{background:var(--green)}
.trend-down{background:var(--red)}
.trend-neutral{background:var(--gold)}
</style>
</head>

<body>

<div class="navbar">
  <div class="status">
    <div>Sistem: <span id="sys" class="badge yellow">--</span></div>
    <div>Piyasa: <span id="market" class="badge yellow">--</span></div>
    <div>Son Tarama: <b id="scan">--:--:--</b></div>
  </div>
  <button onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<div class="filters" id="filters">
  <label><input type="checkbox" value="favorites"> ⭐ Favoriler</label>
  <label><input type="checkbox" value="pullback"> Pullback</label>
  <label><input type="checkbox" value="trend_break"> Trend Kırılımı</label>
  <label><input type="checkbox" value="breakout"> Direnç Kırılımı</label>
  <label><input type="checkbox" value="rsi"> RSI</label>
  <label><input type="checkbox" value="kombine"> Kombine</label>
  <label><input type="checkbox" value="super_kombine"> Süper Kombine</label>
  <label><input type="checkbox" value="l2"> L2</label>
  <label><input type="checkbox" value="l3"> L3</label>
  <label><input type="checkbox" value="l4"> L4</label>
</div>

<div class="info-bar" id="info">Veri bekleniyor...</div>
<div id="cards"></div>

<script>
let ALL_SIGNALS=[]
let favs=JSON.parse(localStorage.getItem("favs")||"[]")

function toggleTheme(){
  document.body.classList.toggle("light")
  localStorage.setItem("theme",
    document.body.classList.contains("light")?"light":"dark")
}
if(localStorage.getItem("theme")==="light"){
  document.body.classList.add("light")
}

function toggleFav(sym){
  favs = favs.includes(sym)
    ? favs.filter(x=>x!==sym)
    : [...favs,sym]
  localStorage.setItem("favs",JSON.stringify(favs))
  render()
}

function activeFilters(){
  return [...document.querySelectorAll(".filters input:checked")].map(i=>i.value)
}

/* TYPE → LEVEL */
function inferLevel(type){
  if(["l2","l3","l4"].includes(type)) return type.toUpperCase()
  if(type==="pullback") return "L2"
  if(type==="strong_pullback") return "L3"
  if(type==="kombine") return "L3"
  if(type==="super_kombine") return "L4"
  return ""
}

/* TYPE → TITLE */
function inferTitle(type){
  const map={
    kombine:"Kombine Sinyal",
    super_kombine:"Süper Kombine",
    pullback:"Pullback",
    strong_pullback:"Güçlü Pullback",
    three_peak:"3’lü Tepe Kırılımı",
    resistance_break:"Direnç Kırılımı",
    l2:"L2 Trend",
    l3:"L3 Güçlü Trend",
    l4:"L4 Smart Money"
  }
  return map[type]||type
}

function trendBarHTML(signal){
  const up = signal.details?.trend_up || 0
  const down = signal.details?.trend_down || 0
  const neutral = Math.max(0,100-up-down)
  return `
    <div class="trend-bar">
      <div class="trend-up" style="width:${up}%"></div>
      <div class="trend-neutral" style="width:${neutral}%"></div>
      <div class="trend-down" style="width:${down}%"></div>
    </div>
  `
}

function render(){
  const wrap=document.getElementById("cards")
  wrap.innerHTML=""
  const f=activeFilters()

  let data=ALL_SIGNALS.filter(s=>{
    if(f.includes("favorites") && !favs.includes(s.symbol)) return false
    if(f.includes("pullback") && !["pullback","strong_pullback"].includes(s.type)) return false
    if(f.includes("trend_break") && s.type!=="three_peak") return false
    if(f.includes("breakout") && s.type!=="resistance_break") return false
    if(f.includes("rsi") && !["kombine","super_kombine"].includes(s.type)) return false
    if(f.includes("kombine") && s.type!=="kombine") return false
    if(f.includes("super_kombine") && s.type!=="super_kombine") return false
    if(f.includes("l2") && s.type!=="l2") return false
    if(f.includes("l3") && s.type!=="l3") return false
    if(f.includes("l4") && s.type!=="l4") return false
    return true
  })

  if(!data.length){
    info.textContent="Şu an filtrelere uygun sinyal yok."
    return
  }

  info.textContent=data.length+" adet sinyal"

  data.forEach(s=>{
    const c=document.createElement("div")
    c.className="card"

    const level=inferLevel(s.type)
    const title=s.title||inferTitle(s.type)

    let tags=[]
    if(level) tags.push(`<span class="tag ${level.toLowerCase()}">${level}</span>`)
    if(s.type==="kombine") tags.push(`<span class="tag kombine">Kombine</span>`)
    if(s.type==="super_kombine") tags.push(`<span class="tag super_kombine">Süper</span>`)

    c.innerHTML=`
      <div class="fav ${favs.includes(s.symbol)?"active":""}"
           onclick="toggleFav('${s.symbol}')">★</div>
      <b>${s.symbol}</b><br>
      ${title}<br>
      ${tags.join(" ")}
      ${trendBarHTML(s)}
    `
    wrap.appendChild(c)
  })
}

async function load(){
  const r=await fetch("/api")
  const j=await r.json()

  sys.textContent=j.system_active?"AKTİF":"PASİF"
  sys.className="badge "+(j.system_active?"green":"red")

  market.textContent=j.market_open?"AÇIK":"KAPALI"
  market.className="badge "+(j.market_open?"green":"red")

  if(j.last_scan){
    scan.textContent=new Date(j.last_scan*1000).toLocaleTimeString()
  }

  ALL_SIGNALS=j.signals||[]
  render()
}

document.getElementById("filters").addEventListener("change",render)
setInterval(load,5000)
load()
</script>

</body>
</html>
