<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Profesyonel BIST Sinyal Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d1117;
  --card:#161b22;
  --text:#e6edf3;
  --muted:#8b949e;
  --green:#2ea043;
  --red:#f85149;
  --blue:#1f6feb;
  --gold:#d29922;
  --purple:#8957e5;
}

*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
  background:#010409;
  border-bottom:1px solid #21262d;
}
header h1{font-size:18px;margin:0;font-weight:700}

.filters{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  padding:12px 16px;
  border-bottom:1px solid #21262d;
  background:#010409;
}
.filters label{
  font-size:13px;
  cursor:pointer;
  color:var(--muted);
  background:#161b22;
  padding:6px 10px;
  border-radius:8px;
  border:1px solid #21262d;
}
.filters input{margin-right:6px}

#cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
  padding:16px;
}

.card{
  background:linear-gradient(180deg,#161b22,#0d1117);
  border:1px solid #21262d;
  border-radius:16px;
  padding:14px;
  transition:.25s;
  position:relative;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 30px rgba(0,0,0,.6);
}
.card.premium{border:1px solid var(--gold)}

.card-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.symbol{font-size:16px;font-weight:700}
.price{font-size:14px;color:var(--muted)}

.signal{
  margin-top:6px;
  font-weight:700;
  font-size:14px;
}
.signal.buy{color:var(--green)}
.signal.sell{color:var(--red)}
.signal.strong{color:var(--blue)}

.trend{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:8px;
  font-size:13px;
}
.arrow.up{color:var(--green)}
.arrow.down{color:var(--red)}

.progress{
  margin-top:6px;
  background:#21262d;
  border-radius:10px;
  height:12px;
  overflow:hidden;
  position:relative;
}
.progress span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#238636,#2ea043);
}
.progress b{
  position:absolute;
  right:6px;
  top:-18px;
  font-size:11px;
  color:var(--muted);
}

.badges{
  margin-top:8px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}
.tag{
  font-size:11px;
  padding:3px 6px;
  border-radius:6px;
  background:#21262d;
  border:1px solid #30363d;
}
.tag.l3,.tag.l4{background:var(--purple);color:#fff}
.tag.super_kombine{background:var(--gold);color:#000}
.tag.target{background:var(--green);color:#000}

.levels{
  margin-top:6px;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>

<header>
  <h1>📊 Zengin Edecek Hisseler</h1>
</header>

<!-- 🔥 TÜM FİLTRELER -->
<div class="filters">
  <label><input type="checkbox" value="buy" checked> AL</label>
  <label><input type="checkbox" value="sell" checked> SAT</label>

  <label><input type="checkbox" value="pullback"> Pullback</label>
  <label><input type="checkbox" value="strong_reversal"> Güçlü Dönüş</label>
  <label><input type="checkbox" value="breakout"> Direnç Kırılım</label>

  <label><input type="checkbox" value="kombine"> Kombine</label>
  <label><input type="checkbox" value="super_kombine"> Süper Kombine</label>

  <label><input type="checkbox" value="l2"> L2</label>
  <label><input type="checkbox" value="l3"> L3</label>
  <label><input type="checkbox" value="l4"> L4</label>

  <label><input type="checkbox" value="order_block"> Order Block</label>
  <label><input type="checkbox" value="kurumsal"> Kurumsal</label>
</div>

<div id="cards"></div>

<script>
async function loadSignals(){
  const res = await fetch("/api");
  const json = await res.json();
  render(applyFilters(json.signals || []));
}

function applyFilters(data){
  const active = Array.from(
    document.querySelectorAll(".filters input:checked")
  ).map(i => i.value);

  if(active.length === 0) return data;

  return data.filter(s=>{
    if(active.includes(s.signal_type)) return true;
    if(s.level && active.includes(s.level.toLowerCase())) return true;
    if(s.tags && s.tags.some(t=>active.includes(t))) return true;
    return false;
  });
}

function render(data){
  const wrap=document.getElementById("cards");
  wrap.innerHTML="";

  if(data.length===0){
    wrap.innerHTML="<p style='color:#8b949e'>Filtrelere uygun sinyal yok.</p>";
    return;
  }

  data.forEach(s=>{
    const card=document.createElement("div");
    card.className="card premium";

    const dir=s.direction==="down"?"down":"up";
    const trend=s.trend_strength||50;

    card.innerHTML=`
      <div class="card-header">
        <div class="symbol">${s.symbol}</div>
        <div class="price">${s.current_price || s.price}</div>
      </div>

      <div class="signal ${s.signal_type}">
        ${s.title || s.signal_type.toUpperCase()}
      </div>

      <div class="trend">
        <span class="arrow ${dir}">${dir==="up"?"⬆":"⬇"}</span>
        Trend Gücü
      </div>

      <div class="progress">
        <span style="width:${trend}%"></span>
        <b>%${trend}</b>
      </div>

      <div class="badges">
        ${(s.tags||[]).map(t=>`<span class="tag ${t}">${t.toUpperCase()}</span>`).join("")}
        ${s.target_hit ? `<span class="tag target">%2 HEDEF</span>` : ""}
      </div>

      <div class="levels">
        Destek: ${s.support||"-"} | Direnç: ${s.resistance||"-"}
      </div>
    `;
    wrap.appendChild(card);
  });
}

setInterval(loadSignals,5000);
loadSignals();
</script>

</body>
</html>
