<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Profesyonel Sinyal Paneli</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #0e1117;
  --card: #161b22;
  --text: #e6edf3;
  --green: #2ea043;
  --red: #f85149;
  --yellow: #d29922;
  --blue: #1f6feb;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, Arial, sans-serif;
}

header {
  padding: 16px;
  background: #010409;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  background: var(--blue);
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

button:hover {
  opacity: 0.9;
}

.badge {
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  display: inline-block;
}

.badge.green { background: var(--green); }
.badge.red { background: var(--red); }
.badge.yellow { background: var(--yellow); }

.container {
  padding: 16px;
}

.status-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.status-card {
  background: var(--card);
  padding: 14px;
  border-radius: 10px;
}

.signal-card {
  background: var(--card);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  border-left: 4px solid var(--green);
}

.signal-card.red {
  border-left-color: var(--red);
}

.signal-title {
  font-size: 16px;
  font-weight: 700;
}

.small {
  font-size: 13px;
  opacity: 0.85;
}
</style>
</head>

<body>

<header>
  <div><b>Yakında Zengin Edecek Sinyaller</b></div>
  <div>
    <span id="clock"></span>
    <button onclick="wakeSystem()">Sistemi Uyandır</button>
  </div>
</header>

<div class="container">

  <!-- SİLİSTEM & MARKET -->
  <div class="status-grid">

    <div class="status-card">
      <div class="small">Sistem Durumu</div>
      <div id="systemStatus" class="badge yellow">Kontrol ediliyor</div>
      <div class="small" id="lastUpdate"></div>
    </div>

    <div class="status-card">
      <div class="small">Piyasa Durumu</div>
      <div id="marketStatus" class="badge yellow">Bilinmiyor</div>
    </div>

  </div>

  <!-- SİNYALLER -->
  <div id="signals"></div>

</div>

<script>
function updateClock() {
  document.getElementById("clock").innerText =
    new Date().toLocaleString("tr-TR");
}
setInterval(updateClock, 1000);
updateClock();

function isMarketOpen(now) {
  const day = now.getDay();
  if (day === 0 || day === 6) return false;
  const min = now.getHours() * 60 + now.getMinutes();
  return min >= 580 && min <= 1090;
}

async function wakeSystem() {
  try {
    await fetch("/ping");
    alert("Sistem uyandırıldı (ping gönderildi)");
  } catch {
    alert("Sistem uyandırılamadı");
  }
}

async function loadData() {
  try {
    const res = await fetch("/api");
    const json = await res.json();
    const now = new Date();

    // MARKET
    const marketOpen = isMarketOpen(now);
    const marketEl = document.getElementById("marketStatus");
    marketEl.innerText = marketOpen ? "AÇIK" : "KAPALI";
    marketEl.className = "badge " + (marketOpen ? "green" : "red");

    // SYSTEM
    const sysEl = document.getElementById("systemStatus");
    const lastTs = json.timestamp ? new Date(json.timestamp * 1000) : null;

    if (lastTs && (now - lastTs) < 180000) {
      sysEl.innerText = "AKTİF";
      sysEl.className = "badge green";
    } else {
      sysEl.innerText = "UYKUDA";
      sysEl.className = "badge red";
    }

    document.getElementById("lastUpdate").innerText =
      lastTs ? "Son veri: " + lastTs.toLocaleTimeString("tr-TR") : "";

    // SIGNALS
    const box = document.getElementById("signals");
    box.innerHTML = "";

    (json.data || []).forEach(s => {
      if (!s.last_signal && !s.composite_signal && !s.super_score) return;

      const card = document.createElement("div");
      card.className = "signal-card" + (s.last_signal === "SAT" ? " red" : "");

      card.innerHTML = `
        <div class="signal-title">${s.symbol}</div>
        <div class="small">Fiyat: ${s.current_price} | RSI: ${s.RSI}</div>
        <div class="small">Trend: ${s.trend}</div>
        <div class="small">Süper Skor: ${s.super_score || "-"}</div>
      `;

      box.appendChild(card);
    });

  } catch (e) {
    console.error(e);
  }
}

setInterval(loadData, 5000);
loadData();
</script>

</body>
</html>
