<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Canlı Sinyal Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
}
header {
    padding: 14px;
    background: #020617;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: #38bdf8;
}
.container {
    padding: 10px;
}
.controls {
    margin-bottom: 10px;
}
select {
    padding: 6px;
    font-size: 14px;
}
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}
th, td {
    padding: 6px;
    border-bottom: 1px solid #1e293b;
    text-align: center;
}
th {
    background: #020617;
    position: sticky;
    top: 0;
}
tr.signal {
    background: #052e16;
}
tr.sell {
    background: #3f1d1d;
}
.badge {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
}
.buy { background: #16a34a; }
.sellb { background: #dc2626; }
.combo { background: #9333ea; }
</style>
</head>

<body>

<header>📊 BIST Canlı Hisse Sinyal Dashboard</header>

<div class="container">

<div class="controls">
    Filtre:
    <select id="filter">
        <option value="ALL">Tümü</option>
        <option value="AL">AL</option>
        <option value="SAT">SAT</option>
        <option value="COMBO">Kombine</option>
    </select>
</div>

<table>
<thead>
<tr>
    <th>Hisse</th>
    <th>Fiyat</th>
    <th>Trend</th>
    <th>RSI</th>
    <th>Hacim</th>
    <th>Değişim %</th>
    <th>Sinyal</th>
    <th>MA</th>
</tr>
</thead>
<tbody id="table-body">
<tr><td colspan="8">Yükleniyor...</td></tr>
</tbody>
</table>

</div>

<script>
async function loadData() {
    try {
        const res = await fetch("/api");
        const json = await res.json();
        const data = json.data || [];

        const filter = document.getElementById("filter").value;
        const body = document.getElementById("table-body");
        body.innerHTML = "";

        data.forEach(item => {
            let signal = "";
            let cls = "";

            if (item.composite_signal) {
                signal = "KOMBİNE";
                cls = "signal";
            } else if (item.last_signal === "AL") {
                signal = "AL";
                cls = "signal";
            } else if (item.last_signal === "SAT") {
                signal = "SAT";
                cls = "sell";
            }

            if (filter !== "ALL") {
                if (filter === "AL" && item.last_signal !== "AL") return;
                if (filter === "SAT" && item.last_signal !== "SAT") return;
                if (filter === "COMBO" && !item.composite_signal) return;
            }

            const tr = document.createElement("tr");
            tr.className = cls;

            tr.innerHTML = `
                <td>${item.symbol}</td>
                <td>${item.current_price ?? "-"}</td>
                <td>${item.trend ?? "-"}</td>
                <td>${item.RSI?.toFixed(2) ?? "-"}</td>
                <td>${item.volume ?? "-"}</td>
                <td>${item.daily_change ?? "-"}</td>
                <td>
                    ${signal === "AL" ? "<span class='badge buy'>AL</span>" : ""}
                    ${signal === "SAT" ? "<span class='badge sellb'>SAT</span>" : ""}
                    ${signal === "KOMBİNE" ? "<span class='badge combo'>KOMBİNE</span>" : ""}
                </td>
                <td>
                    20:${item.ma_breaks?.MA20 ?? "-"} |
                    50:${item.ma_breaks?.MA50 ?? "-"}
                </td>
            `;
            body.appendChild(tr);
        });

        if (body.innerHTML === "") {
            body.innerHTML = "<tr><td colspan='8'>Filtreye uygun sinyal yok</td></tr>";
        }

    } catch (e) {
        document.getElementById("table-body").innerHTML =
            "<tr><td colspan='8'>API bağlantı hatası</td></tr>";
    }
}

document.getElementById("filter").addEventListener("change", loadData);

loadData();
setInterval(loadData, 60000);
</script>

</body>
</html>
