<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Profesyonel BIST Sinyal Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d1117;
  --card:#161b22;
  --text:#e6edf3;
  --muted:#8b949e;
  --green:#2ea043;
  --red:#f85149;
  --blue:#1f6feb;
  --gold:#d29922;
  --purple:#8957e5;
  --border:#21262d;
}

/* ☀️ LIGHT THEME */
body.light{
  --bg:#f6f8fa;
  --card:#ffffff;
  --text:#24292f;
  --muted:#57606a;
  --border:#d0d7de;
}

*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);transition:.3s}

/* ================= NAVBAR ================= */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  background:var(--card);
  border-bottom:1px solid var(--border);
}

.status{
  display:flex;
  gap:14px;
  font-size:13px;
}
.badge{
  padding:4px 8px;
  border-radius:6px;
  font-weight:600;
}
.green{background:var(--green);color:#fff}
.red{background:var(--red);color:#fff}
.yellow{background:var(--gold);color:#000}

.nav-actions button{
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

/* ================= FILTERS ================= */
.filters{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:12px 16px;
  background:var(--card);
  border-bottom:1px solid var(--border);
}
.filters label{
  font-size:12px;
  cursor:pointer;
  color:var(--muted);
  background:var(--bg);
  padding:6px 10px;
  border-radius:8px;
  border:1px solid var(--border);
}

/* ================= INFO ================= */
.info-bar{
  padding:10px 16px;
  font-size:13px;
  color:var(--muted);
}

/* ================= CARDS ================= */
#cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
  padding:16px;
}

.card{
  background:linear-gradient(180deg,var(--card),var(--bg));
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  transition:.25s;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 30px rgba(0,0,0,.3);
}
.card.premium{border:1px solid var(--gold)}

.card-header{
  display:flex;
  justify-content:space-between;
}
.symbol{font-weight:700}
.price{color:var(--muted)}

.signal{margin-top:6px;font-weight:700}
.signal.buy{color:var(--green)}
.signal.sell{color:var(--red)}
.signal.strong{color:var(--blue)}

.trend{display:flex;gap:6px;margin-top:8px;font-size:13px}
.arrow.up{color:var(--green)}
.arrow.down{color:var(--red)}

.progress{
  margin-top:6px;
  height:12px;
  background:var(--border);
  border-radius:8px;
  overflow:hidden;
  position:relative;
}
.progress span{
  height:100%;
  display:block;
  background:linear-gradient(90deg,#238636,#2ea043);
}
.progress b{
  position:absolute;
  right:6px;
  top:-18px;
  font-size:11px;
  color:var(--muted);
}

.badges{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.tag{
  font-size:11px;
  padding:3px 6px;
  border-radius:6px;
  background:var(--border);
}
.tag.l3,.tag.l4{background:var(--purple);color:#fff}
.tag.super_kombine{background:var(--gold);color:#000}
.tag.target{background:var(--green);color:#000}

.levels{margin-top:6px;font-size:12px;color:var(--muted)}
</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar">
  <div class="status">
    <div>Sistem: <span id="sys" class="badge yellow">--</span></div>
    <div>Piyasa: <span id="market" class="badge yellow">--</span></div>
    <div>Son Tarama: <b id="scan">--:--:--</b></div>
  </div>
  <div class="nav-actions">
    <button onclick="toggleTheme()">🌙 / ☀️</button>
  </div>
</div>

<!-- ================= FILTERS ================= -->
<div class="filters">
  <label><input type="checkbox" value="buy" checked> AL</label>
  <label><input type="checkbox" value="sell" checked> SAT</label>
  <label><input type="checkbox" value="pullback"> Pullback</label>
  <label><input type="checkbox" value="strong_reversal"> Güçlü Dönüş</label>
  <label><input type="checkbox" value="breakout"> Direnç Kırılım</label>
  <label><input type="checkbox" value="kombine"> Kombine</label>
  <label><input type="checkbox" value="super_kombine"> Süper Kombine</label>
  <label><input type="checkbox" value="l2"> L2</label>
  <label><input type="checkbox" value="l3"> L3</label>
  <label><input type="checkbox" value="l4"> L4</label>
</div>

<div class="info-bar" id="info">Veri bekleniyor...</div>
<div id="cards"></div>

<script>
/* ========== THEME ========== */
function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme",
    document.body.classList.contains("light")?"light":"dark");
}
if(localStorage.getItem("theme")==="light"){
  document.body.classList.add("light");
}

/* ========== LOAD DATA ========== */
async function load(){
  const res = await fetch("/api");
  const j = await res.json();

  sys.textContent = j.system_active ? "AKTİF" : "PASİF";
  sys.className = "badge " + (j.system_active?"green":"red");

  market.textContent = j.market_open ? "AÇIK" : "KAPALI";
  market.className = "badge " + (j.market_open?"green":"red");

  if(j.last_scan){
    scan.textContent = new Date(j.last_scan*1000).toLocaleTimeString();
  }

  render(j.signals || []);
}

function render(data){
  const wrap=document.getElementById("cards");
  wrap.innerHTML="";

  if(data.length===0){
    info.textContent="Şu an filtrelere uygun sinyal yok.";
    return;
  }

  info.textContent=`${data.length} adet sinyal bulundu`;

  data.forEach(s=>{
    const card=document.createElement("div");
    card.className="card premium";

    const trend=s.trend_strength||50;
    const dir=s.direction==="down"?"down":"up";

    card.innerHTML=`
      <div class="card-header">
        <div class="symbol">${s.symbol}</div>
        <div class="price">${s.current_price}</div>
      </div>

      <div class="signal ${s.signal_type}">
        ${s.title || s.signal_type.toUpperCase()}
      </div>

      <div class="trend">
        <span class="arrow ${dir}">${dir==="up"?"⬆":"⬇"}</span> Trend Gücü
      </div>

      <div class="progress">
        <span style="width:${trend}%"></span>
        <b>%${trend}</b>
      </div>

      <div class="badges">
        ${(s.tags||[]).map(t=>`<span class="tag ${t}">${t.toUpperCase()}</span>`).join("")}
        ${s.target_hit?'<span class="tag target">%2 HEDEF</span>':''}
      </div>

      <div class="levels">
        Destek: ${s.support||"-"} | Direnç: ${s.resistance||"-"}
      </div>
    `;
    wrap.appendChild(card);
  });
}

setInterval(load,5000);
load();
</script>

</body>
</html>
