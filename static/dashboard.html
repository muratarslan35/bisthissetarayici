<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Profesyonel Sinyal Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --bg: #0f172a;
    --card: #111827;
    --text: #e5e7eb;
    --accent: #22c55e;
    --danger: #ef4444;
    --warning: #facc15;
    --border: #1f2937;
}

.light {
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --accent: #16a34a;
    --danger: #dc2626;
    --warning: #ca8a04;
    --border: #e5e7eb;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
}

h1 {
    font-size: 20px;
    margin: 0;
}

button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.filters {
    display: flex;
    gap: 12px;
    padding: 12px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
}

.filters label {
    font-size: 14px;
    cursor: pointer;
}

table {
    width: 100%;
    border-collapse: collapse;
}

thead {
    background: var(--card);
}

th, td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    text-align: center;
}

th {
    position: sticky;
    top: 0;
}

.badge {
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
}

.al { background: var(--accent); color: #000; }
.sat { background: var(--danger); color: #fff; }
.combo { background: #6366f1; color: #fff; }
.super { background: #ec4899; color: #fff; }
.warn { background: var(--warning); color: #000; }

.star {
    cursor: pointer;
    font-size: 18px;
}

.star.active {
    color: gold;
}

@media(max-width: 768px) {
    th, td { font-size: 12px; }
}
</style>
</head>

<body>

<header>
    <h1>📊 BIST Profesyonel Sinyal Dashboard</h1>
    <button onclick="toggleTheme()">🌗 Tema</button>
</header>

<div class="filters">
    <label><input type="checkbox" id="f_al" checked> AL</label>
    <label><input type="checkbox" id="f_sat" checked> SAT</label>
    <label><input type="checkbox" id="f_combo" checked> Kombine</label>
    <label><input type="checkbox" id="f_super" checked> Süper Kombine</label>
    <label><input type="checkbox" id="f_three"> 3’lü Tepe</label>
    <label><input type="checkbox" id="f_support"> Destek</label>
    <label><input type="checkbox" id="f_resistance"> Direnç</label>
    <label><input type="checkbox" id="f_fav"> ⭐ Favoriler</label>
</div>

<table>
<thead>
<tr>
    <th>⭐</th>
    <th>Hisse</th>
    <th>Sinyal</th>
    <th>Fiyat</th>
    <th>Trend</th>
    <th>RSI</th>
    <th>Günlük %</th>
    <th>Hacim</th>
    <th>Zaman</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<script>
let theme = localStorage.getItem("theme") || "dark";
if (theme === "light") document.body.classList.add("light");

let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");

function toggleTheme() {
    document.body.classList.toggle("light");
    localStorage.setItem("theme",
        document.body.classList.contains("light") ? "light" : "dark"
    );
}

function toggleFav(sym) {
    if (favorites.includes(sym)) {
        favorites = favorites.filter(s => s !== sym);
    } else {
        favorites.push(sym);
    }
    localStorage.setItem("favorites", JSON.stringify(favorites));
    render(window.lastData || []);
}

function badge(text, cls) {
    return `<span class="badge ${cls}">${text}</span>`;
}

function render(data) {
    window.lastData = data;
    const rows = document.getElementById("rows");
    rows.innerHTML = "";

    data.forEach(i => {
        if (!i.symbol) return;

        if (document.getElementById("f_fav").checked && !favorites.includes(i.symbol)) return;

        let signals = [];
        if (i.last_signal === "AL" && document.getElementById("f_al").checked)
            signals.push(badge("AL", "al"));

        if (i.last_signal === "SAT" && document.getElementById("f_sat").checked)
            signals.push(badge("SAT", "sat"));

        if (i.composite_signal && document.getElementById("f_combo").checked)
            signals.push(badge("KOMBİNE", "combo"));

        if (i.super_combo && document.getElementById("f_super").checked)
            signals.push(badge("SÜPER", "super"));

        if (i.three_peak_break && document.getElementById("f_three").checked)
            signals.push(badge("3’LÜ TEPE", "warn"));

        if (!signals.length) return;

        const fav = favorites.includes(i.symbol) ? "active" : "";

        rows.innerHTML += `
        <tr>
            <td><span class="star ${fav}" onclick="toggleFav('${i.symbol}')">★</span></td>
            <td><b>${i.symbol}</b></td>
            <td>${signals.join(" ")}</td>
            <td>${i.current_price}</td>
            <td>${i.trend}</td>
            <td>${i.RSI}</td>
            <td>${i.daily_change}</td>
            <td>${i.volume}</td>
            <td>${i.signal_time || "-"}</td>
        </tr>`;
    });
}

async function fetchData() {
    try {
        const r = await fetch("/api");
        const j = await r.json();
        if (j.data) render(j.data);
    } catch {}
}

setInterval(fetchData, 15000);
fetchData();
</script>

</body>
</html>
