<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Profesyonel BIST Sinyal Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d1117;
  --card:#161b22;
  --text:#e6edf3;
  --muted:#8b949e;
  --green:#2ea043;
  --red:#f85149;
  --gold:#d29922;
  --purple:#8957e5;
  --border:#21262d;
}
body.light{
  --bg:#f6f8fa;
  --card:#ffffff;
  --text:#24292f;
  --muted:#57606a;
  --border:#d0d7de;
}
*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);transition:.3s}

/* NAVBAR */
.navbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);
}
.status{display:flex;gap:14px;font-size:13px}
.badge{padding:4px 8px;border-radius:6px;font-weight:600}
.green{background:var(--green);color:#fff}
.red{background:var(--red);color:#fff}
.yellow{background:var(--gold);color:#000}

/* FILTERS */
.filters{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);
}
.filters label{
  font-size:12px;cursor:pointer;color:var(--muted);
  background:var(--bg);padding:6px 10px;border-radius:8px;border:1px solid var(--border);
}

/* INFO */
.info-bar{padding:10px 16px;font-size:13px;color:var(--muted)}

/* CARDS */
#cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;padding:16px;
}
.card{
  background:linear-gradient(180deg,var(--card),var(--bg));
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  transition:.25s;
  position:relative;
}
.card:hover{transform:translateY(-4px)}
.fav{
  position:absolute;top:10px;right:12px;
  cursor:pointer;font-size:18px;color:var(--muted);
}
.fav.active{color:gold}

/* TAGS / ROZETLER */
.tag{
  font-size:11px;padding:3px 6px;border-radius:6px;background:var(--border);
  display:inline-block;margin-right:4px;margin-top:4px;
}
.tag.l2{background:#6c5dd3;color:#fff}
.tag.l3{background:#7dd3fc;color:#000}
.tag.l4{background:#f9a8d4;color:#000}
.tag.ob{background:#f87171;color:#fff}
.tag.kombine{background:#facc15;color:#000}
.tag.super_kombine{background:#34d399;color:#000}
.tag.target{background:var(--green);color:#000}

/* TREND BAR */
.trend-bar{
  display:flex;
  height:6px;
  margin-top:6px;
  border-radius:3px;
  overflow:hidden;
  background:var(--border);
}
.trend-bar div{
  height:100%;
}
.trend-up{background:var(--green)}
.trend-down{background:var(--red)}
.trend-neutral{background:var(--gold)}
</style>
</head>

<body>

<div class="navbar">
  <div class="status">
    <div>Sistem: <span id="sys" class="badge yellow">--</span></div>
    <div>Piyasa: <span id="market" class="badge yellow">--</span></div>
    <div>Son Tarama: <b id="scan">--:--:--</b></div>
  </div>
  <button onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<div class="filters" id="filters">
  <label><input type="checkbox" value="favorites"> ⭐ Favoriler</label>
  <label><input type="checkbox" value="buy" checked> AL</label>
  <label><input type="checkbox" value="sell" checked> SAT</label>
  <label><input type="checkbox" value="pullback"> Pullback</label>
  <label><input type="checkbox" value="strong_reversal"> Güçlü Dönüş</label>
  <label><input type="checkbox" value="trend_break"> Trend Kırılımı</label>
  <label><input type="checkbox" value="breakout"> Direnç Kırılımı</label>
  <label><input type="checkbox" value="rsi"> RSI</label>
  <label><input type="checkbox" value="kombine"> Kombine</label>
  <label><input type="checkbox" value="super_kombine"> Süper Kombine</label>
  <label><input type="checkbox" value="l2"> L2 (Orta Trend)</label>
  <label><input type="checkbox" value="l3"> L3 (Güçlü Trend)</label>
  <label><input type="checkbox" value="l4"> L4 (Smart Money)</label>
  <label><input type="checkbox" value="ob"> OB (Kurumsal Alım)</label>
</div>

<div class="info-bar" id="info">Veri bekleniyor...</div>
<div id="cards"></div>

<script>
let ALL_SIGNALS=[]
let favs=JSON.parse(localStorage.getItem("favs")||"[]")

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light")
  localStorage.setItem("theme",
    document.body.classList.contains("light")?"light":"dark")
}
if(localStorage.getItem("theme")==="light"){
  document.body.classList.add("light")
}

/* FAVORI */
function toggleFav(sym){
  favs = favs.includes(sym)
    ? favs.filter(x=>x!==sym)
    : [...favs,sym]
  localStorage.setItem("favs",JSON.stringify(favs))
  render()
}

function activeFilters(){
  return [...document.querySelectorAll(".filters input:checked")].map(i=>i.value)
}

/* TREND BAR HTML */
function trendBarHTML(signal){
  const up = signal.details?.trend_up||0
  const down = signal.details?.trend_down||0
  const neutral = 100 - up - down
  return `
    <div class="trend-bar">
      <div class="trend-up" style="width:${up}%"></div>
      <div class="trend-neutral" style="width:${neutral}%"></div>
      <div class="trend-down" style="width:${down}%"></div>
    </div>
  `
}

/* RENDER */
function render(){
  const wrap=document.getElementById("cards")
  wrap.innerHTML=""
  const f=activeFilters()

  let data=ALL_SIGNALS.filter(s=>{
    if(f.includes("favorites") && !favs.includes(s.symbol)) return false

    if(f.some(x=>["l2","l3","l4","ob","kombine","super_kombine"].includes(x))){
      const lvl=(s.details?.level||"").toLowerCase()
      if(lvl && !f.includes(lvl)) return false
      if(s.type==="order_block" && !f.includes("ob")) return false
      if(s.type==="kombine" && !f.includes("kombine")) return false
      if(s.type==="super_kombine" && !f.includes("super_kombine")) return false
    }
    return true
  })

  if(!data.length){
    info.textContent="Şu an filtrelere uygun sinyal yok."
    return
  }
  info.textContent=data.length+" adet sinyal"

  data.forEach(s=>{
    const c=document.createElement("div")
    c.className="card"
    let tags=[]
    if(s.details?.level) tags.push(`<span class="tag ${s.details.level.toLowerCase()}">${s.details.level}</span>`)
    if(s.type==="kombine") tags.push(`<span class="tag kombine">Kombine</span>`)
    if(s.type==="super_kombine") tags.push(`<span class="tag super_kombine">Süper Kombine</span>`)
    if(s.type==="order_block") tags.push(`<span class="tag ob">OB</span>`)
    if(s.details?.target) tags.push(`<span class="tag target">${s.details.target}</span>`)

    c.innerHTML=`
      <div class="fav ${favs.includes(s.symbol)?"active":""}"
           onclick="toggleFav('${s.symbol}')">★</div>
      <b>${s.symbol}</b><br>
      ${s.title || s.type}<br>
      ${tags.join(" ")}
      ${trendBarHTML(s)}
    `
    wrap.appendChild(c)
  })
}

/* LOAD */
async function load(){
  const r=await fetch("/api")
  const j=await r.json()

  sys.textContent=j.system_active?"AKTİF":"PASİF"
  sys.className="badge "+(j.system_active?"green":"red")

  market.textContent=j.market_open?"AÇIK":"KAPALI"
  market.className="badge "+(j.market_open?"green":"red")

  if(j.last_scan){
    scan.textContent=new Date(j.last_scan*1000).toLocaleTimeString()
  }

  ALL_SIGNALS=j.signals||[]
  render()
}

document.getElementById("filters").addEventListener("change",render)
setInterval(load,5000)
load()
</script>

</body>
</html>
