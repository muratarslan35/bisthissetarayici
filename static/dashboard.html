<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Sinyal Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    background:#0d1117;
    color:#c9d1d9;
    font-family:Arial, sans-serif;
    margin:0;
}
h1 { text-align:center; margin:15px; color:#58a6ff; }
.card {
    background:#161b22;
    border-left:5px solid #58a6ff;
    padding:15px;
    margin:10px;
    border-radius:10px;
}
.green { border-color:#2ea043; }
.red { border-color:#f85149; }
.yellow { border-color:#e3b341; }
.small { font-size:12px; color:#8b949e; }
</style>
</head>
<body>

<h1>📈 BIST Sinyal Dashboard</h1>
<div id="signals"></div>

<script>
async function load() {
    const r = await fetch("/latest-data");
    const j = await r.json();
    const box = document.getElementById("signals");
    box.innerHTML = "";

    (j.data || []).forEach(it => {
        (it.signals || []).forEach(s => {
            const d = document.createElement("div");
            d.className = "card " + (s.color || "");
            d.innerHTML = `
                <b>${it.symbol}</b><br>
                ${s.message.replaceAll("\n","<br>")}
                <div class="small">${s.time}</div>
            `;
            box.appendChild(d);
        });
    });
}
setInterval(load, 5000);
load();
</script>

</body>
</html>
