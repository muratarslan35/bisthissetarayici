<script>
let ALL_SIGNALS=[]
let favs=JSON.parse(localStorage.getItem("favs")||"[]")

function toggleTheme(){
  document.body.classList.toggle("light")
  localStorage.setItem("theme",
    document.body.classList.contains("light")?"light":"dark")
}
if(localStorage.getItem("theme")==="light"){
  document.body.classList.add("light")
}

function toggleFav(sym){
  favs = favs.includes(sym)
    ? favs.filter(x=>x!==sym)
    : [...favs,sym]
  localStorage.setItem("favs",JSON.stringify(favs))
  render()
}

function activeFilters(){
  return [...document.querySelectorAll(".filters input:checked")].map(i=>i.value)
}

/* BACKEND TYPE → LEVEL MAP */
function inferLevel(type){
  if(["l2","l3","l4"].includes(type)) return type.toUpperCase()
  if(type==="strong_pullback") return "L3"
  if(type==="pullback") return "L2"
  if(type==="super_kombine") return "L4"
  if(type==="kombine") return "L3"
  return ""
}

/* BACKEND TYPE → TITLE */
function inferTitle(type){
  const map={
    kombine:"Kombine Sinyal",
    super_kombine:"Süper Kombine",
    pullback:"Pullback",
    strong_pullback:"Güçlü Pullback",
    three_peak:"3’lü Tepe Kırılımı",
    resistance_break:"Direnç Kırılımı",
    l2:"L2 Trend",
    l3:"L3 Güçlü Trend",
    l4:"L4 Smart Money"
  }
  return map[type]||type
}

function trendBarHTML(signal){
  const up = signal.details?.trend_up || 0
  const down = signal.details?.trend_down || 0
  const neutral = Math.max(0,100-up-down)
  return `
    <div class="trend-bar">
      <div class="trend-up" style="width:${up}%"></div>
      <div class="trend-neutral" style="width:${neutral}%"></div>
      <div class="trend-down" style="width:${down}%"></div>
    </div>
  `
}

function render(){
  const wrap=document.getElementById("cards")
  wrap.innerHTML=""
  const f=activeFilters()

  let data=ALL_SIGNALS.filter(s=>{
    if(f.includes("favorites") && !favs.includes(s.symbol)) return false

    if(f.includes("pullback") && !["pullback","strong_pullback"].includes(s.type)) return false
    if(f.includes("trend_break") && s.type!=="three_peak") return false
    if(f.includes("breakout") && s.type!=="resistance_break") return false
    if(f.includes("rsi") && !["kombine","super_kombine"].includes(s.type)) return false
    if(f.includes("kombine") && s.type!=="kombine") return false
    if(f.includes("super_kombine") && s.type!=="super_kombine") return false
    if(f.includes("l2") && s.type!=="l2") return false
    if(f.includes("l3") && s.type!=="l3") return false
    if(f.includes("l4") && s.type!=="l4") return false

    return true
  })

  if(!data.length){
    info.textContent="Şu an filtrelere uygun sinyal yok."
    return
  }

  info.textContent=data.length+" adet sinyal"

  data.forEach(s=>{
    const c=document.createElement("div")
    c.className="card"

    const level=inferLevel(s.type)
    const title=s.title||inferTitle(s.type)

    let tags=[]
    if(level) tags.push(`<span class="tag ${level.toLowerCase()}">${level}</span>`)
    if(s.type==="kombine") tags.push(`<span class="tag kombine">Kombine</span>`)
    if(s.type==="super_kombine") tags.push(`<span class="tag super_kombine">Süper Kombine</span>`)

    c.innerHTML=`
      <div class="fav ${favs.includes(s.symbol)?"active":""}"
           onclick="toggleFav('${s.symbol}')">★</div>
      <b>${s.symbol}</b><br>
      ${title}<br>
      ${tags.join(" ")}
      ${trendBarHTML(s)}
    `
    wrap.appendChild(c)
  })
}

async function load(){
  const r=await fetch("/api")
  const j=await r.json()

  sys.textContent=j.system_active?"AKTİF":"PASİF"
  sys.className="badge "+(j.system_active?"green":"red")

  market.textContent=j.market_open?"AÇIK":"KAPALI"
  market.className="badge "+(j.market_open?"green":"red")

  if(j.last_scan){
    scan.textContent=new Date(j.last_scan*1000).toLocaleTimeString()
  }

  ALL_SIGNALS=j.signals||[]
  render()
}

document.getElementById("filters").addEventListener("change",render)
setInterval(load,5000)
load()
</script>
