<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Profesyonel Sinyal Paneli</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #0e1117;
  --card: #161b22;
  --text: #e6edf3;
  --green: #2ea043;
  --red: #f85149;
  --yellow: #d29922;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, Arial, sans-serif;
}

header {
  padding: 14px 16px;
  background: #010409;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.left, .right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.badge {
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
}

.badge.green { background: var(--green); }
.badge.red { background: var(--red); }
.badge.yellow { background: var(--yellow); }

button {
  background: #238636;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}

.container {
  padding: 16px;
}

.signal-card {
  background: var(--card);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  border-left: 4px solid var(--green);
}

.signal-card.red {
  border-left-color: var(--red);
}

.signal-title {
  font-size: 16px;
  font-weight: 700;
}

.small {
  font-size: 13px;
  opacity: 0.85;
}
</style>
</head>

<body>

<header>
  <div class="left">
    <b>BIST Sinyal Merkezi</b>

    <span id="systemStatus" class="badge yellow">Sistem</span>
    <span id="marketStatus" class="badge yellow">Piyasa</span>
  </div>

  <div class="right">
    <span id="clock"></span>
    <button onclick="wakeSystem()">UYANDIR</button>
  </div>
</header>

<div class="container">
  <div id="signals"></div>
</div>

<script>
function updateClock() {
  document.getElementById("clock").innerText =
    new Date().toLocaleString("tr-TR");
}
setInterval(updateClock, 1000);
updateClock();

function isMarketOpen(now) {
  const d = now.getDay();
  if (d === 0 || d === 6) return false;
  const m = now.getHours() * 60 + now.getMinutes();
  return m >= 580 && m <= 1090;
}

function afterResetTime(now) {
  return now.getHours() > 9 || (now.getHours() === 9 && now.getMinutes() >= 50);
}

async function wakeSystem() {
  await fetch("/api");
}

async function loadData() {
  const res = await fetch("/api");
  const json = await res.json();

  const now = new Date();

  // MARKET
  const marketEl = document.getElementById("marketStatus");
  const open = isMarketOpen(now);
  marketEl.innerText = open ? "AÇIK" : "KAPALI";
  marketEl.className = "badge " + (open ? "green" : "red");

  // SYSTEM
  const sysEl = document.getElementById("systemStatus");
  const lastTs = json.timestamp ? new Date(json.timestamp * 1000) : null;
  if (lastTs && (now - lastTs) < 180000) {
    sysEl.innerText = "AKTİF";
    sysEl.className = "badge green";
  } else {
    sysEl.innerText = "PASİF";
    sysEl.className = "badge red";
  }

  // SIGNALS
  const box = document.getElementById("signals");

  if (afterResetTime(now)) {
    box.innerHTML = ""; // 09:50 sonrası ekran temiz
  }

  (json.data || []).forEach(s => {
    if (!s.last_signal && !s.composite_signal && !s.super_score) return;

    const card = document.createElement("div");
    card.className = "signal-card" + (s.last_signal === "SAT" ? " red" : "");

    card.innerHTML = `
      <div class="signal-title">${s.symbol}</div>
      <div class="small">Fiyat: ${s.current_price} | RSI: ${s.RSI}</div>
      <div class="small">Trend: ${s.trend}</div>
      <div class="small">Skor: ${s.super_score || "-"}</div>
    `;

    box.appendChild(card);
  });
}

setInterval(loadData, 5000);
loadData();
</script>

</body>
</html>
