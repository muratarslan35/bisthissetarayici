<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>BIST Profesyonel Sinyal Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#facc15;
  --blue:#38bdf8;
}

.light{
  --bg:#f3f4f6;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
}

body{
  margin:0;
  font-family:Inter,Arial;
  background:var(--bg);
  color:var(--text);
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  border-bottom:1px solid #1f2933;
}

button{
  background:#1f2937;
  border:none;
  color:#fff;
  padding:8px 14px;
  border-radius:6px;
  cursor:pointer;
}
button:hover{opacity:.9}

.container{
  display:flex;
}

.sidebar{
  width:260px;
  padding:15px;
  border-right:1px solid #1f2933;
}

.sidebar h3{
  margin-top:0;
}

.sidebar label{
  display:block;
  margin:8px 0;
  font-size:14px;
}

.main{
  flex:1;
  padding:20px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:15px;
}

.card{
  background:var(--card);
  border-radius:12px;
  padding:15px;
  box-shadow:0 0 0 1px rgba(255,255,255,.05);
}

.card h4{
  margin:0 0 8px 0;
}

.badges{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.badge{
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
}

.green{background:var(--green);color:#000}
.red{background:var(--red)}
.yellow{background:var(--yellow);color:#000}
.blue{background:var(--blue);color:#000}

.kv{
  font-size:13px;
  margin:4px 0;
}

.muted{color:var(--muted)}
</style>
</head>

<body>
<header>
  <h2>📊 BIST Profesyonel Sinyal Dashboard</h2>
  <button onclick="toggleTheme()">🌗 Tema</button>
</header>

<div class="container">
  <!-- FILTERS -->
  <div class="sidebar">
    <h3>Filtreler</h3>

    <label><input type="checkbox" id="f_combo"> Kombine</label>
    <label><input type="checkbox" id="f_super"> Süper Kombine</label>
    <label><input type="checkbox" id="f_three"> 3'lü Tepe</label>
    <label><input type="checkbox" id="f_support"> Destek Kırılımı</label>
    <label><input type="checkbox" id="f_resistance"> Direnç Kırılımı</label>
    <label><input type="checkbox" id="f_al"> AL</label>
    <label><input type="checkbox" id="f_sat"> SAT</label>

    <br>
    <button onclick="applyFilters()">UYGULA</button>
  </div>

  <!-- CARDS -->
  <div class="main">
    <div class="cards" id="cards"></div>
  </div>
</div>

<script>
let allData=[];
let filters={};

function toggleTheme(){
  document.body.classList.toggle("light");
  localStorage.setItem("theme",document.body.className);
}

if(localStorage.getItem("theme")){
  document.body.className=localStorage.getItem("theme");
}

async function fetchData(){
  const r=await fetch("/api");
  const j=await r.json();
  allData=j.data||[];
  render();
}

function applyFilters(){
  filters={
    combo:f_combo.checked,
    super:f_super.checked,
    three:f_three.checked,
    support:f_support.checked,
    resistance:f_resistance.checked,
    al:f_al.checked,
    sat:f_sat.checked
  };
  render();
}

function pass(item){
  if(filters.combo && !item.composite_signal) return false;
  if(filters.super && !item.super_combo) return false;
  if(filters.three && !item.three_peak_break) return false;
  if(filters.support && !item.support_break) return false;
  if(filters.resistance && !item.resistance_break) return false;
  if(filters.al && item.last_signal!=="AL") return false;
  if(filters.sat && item.last_signal!=="SAT") return false;
  return true;
}

function render(){
  const c=document.getElementById("cards");
  c.innerHTML="";
  allData.filter(pass).forEach(i=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`
      <h4>${i.symbol}</h4>

      <div class="badges">
        ${i.last_signal?`<span class="badge ${i.last_signal==="AL"?"green":"red"}">${i.last_signal}</span>`:""}
        ${i.composite_signal?`<span class="badge blue">Kombine</span>`:""}
        ${i.super_combo?`<span class="badge yellow">SKOR ${i.super_score}</span>`:""}
      </div>

      <div class="kv">Fiyat: <b>${i.current_price}</b></div>
      <div class="kv">RSI: ${i.RSI}</div>
      <div class="kv">Trend: ${i.trend}</div>
      <div class="kv">Hacim: ${i.volume}</div>

      <div class="kv muted">
        Destek: ${i.support||"-"} |
        Direnç: ${i.resistance||"-"} |
        Hedef: ${i.target_price||"-"}
      </div>
    `;
    c.appendChild(div);
  });
}

setInterval(fetchData,30000);
fetchData();
</script>
</body>
</html>
