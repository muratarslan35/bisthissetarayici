<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Profesyonel Sinyal Paneli</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0d1117;
  --card:#161b22;
  --text:#e6edf3;
  --muted:#8b949e;
  --green:#2ea043;
  --red:#f85149;
  --gold:#d29922;
  --purple:#8957e5;
  --border:#21262d;
}
body.light{
  --bg:#f6f8fa;
  --card:#ffffff;
  --text:#24292f;
  --muted:#57606a;
  --border:#d0d7de;
}
*{box-sizing:border-box;font-family:'Inter',sans-serif}
body{margin:0;background:var(--bg);color:var(--text);transition:.3s}

.navbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);
}
.status{display:flex;gap:14px;font-size:13px}
.badge{padding:4px 8px;border-radius:6px;font-weight:600}
.green{background:var(--green);color:#fff}
.red{background:var(--red);color:#fff}
.yellow{background:var(--gold);color:#000}

.filters{
  display:flex;flex-wrap:wrap;gap:8px;
  padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);
}
.filters label{
  font-size:12px;cursor:pointer;color:var(--muted);
  background:var(--bg);padding:6px 10px;border-radius:8px;border:1px solid var(--border);
}

#cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;padding:16px;
}

.card{
  background:linear-gradient(180deg,var(--card),var(--bg));
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
}
.tag{
  display:inline-block;
  margin-top:6px;
  font-size:11px;
  padding:4px 8px;
  border-radius:6px;
  background:var(--border)
}
.tag.L2{background:#0969da;color:#fff}
.tag.L3{background:#8250df;color:#fff}
.tag.L4,.tag.OB{background:#d29922;color:#000}
</style>
</head>

<body>

<div class="navbar">
  <div class="status">
    <div>Sistem: <span id="sys" class="badge yellow">--</span></div>
    <div>Piyasa: <span id="market" class="badge yellow">--</span></div>
    <div>Son Tarama: <b id="scan">--</b></div>
  </div>
  <button onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<div class="filters" id="filters">
  <label><input type="checkbox" value="combined" checked> Kombine</label>
  <label><input type="checkbox" value="super_combined" checked> Süper Kombine</label>
  <label><input type="checkbox" value="ob_reaction" checked> OB</label>
  <label><input type="checkbox" value="L2"> L2</label>
  <label><input type="checkbox" value="L3"> L3</label>
  <label><input type="checkbox" value="L4"> L4</label>
</div>

<div id="cards"></div>

<script>
let ALL=[]

function toggleTheme(){
  document.body.classList.toggle("light")
}

function activeFilters(){
  return [...document.querySelectorAll(".filters input:checked")].map(x=>x.value)
}

function render(){
  const wrap=document.getElementById("cards")
  wrap.innerHTML=""
  const f=activeFilters()

  const data=ALL.filter(s=>{
    if(f.length && !f.includes(s.type) && !f.includes(s.details?.level)) return false
    return true
  })

  if(!data.length){
    wrap.innerHTML="<div style='opacity:.6'>Filtrelere uygun sinyal yok</div>"
    return
  }

  data.forEach(s=>{
    const d=s.details||{}
    const c=document.createElement("div")
    c.className="card"
    c.innerHTML=`
      <b>${s.symbol}</b><br>
      <small>${s.title||s.type}</small><br>

      <div class="tag ${d.level||""}">${d.level||""}</div>

      <div style="margin-top:8px;font-size:13px">
        RSI: ${d.rsi ?? "-"}<br>
        Hacim: ${d.volume ? "✔" : "✖"}<br>
        Trend: ${d.trend || "-"}<br>
        EMA20/50/100/200:
        ${d.ema ? Object.values(d.ema).map(x=>x?.toFixed(2)).join(" / ") : "-"}
      </div>
    `
    wrap.appendChild(c)
  })
}

async function load(){
  const r=await fetch("/api")
  const j=await r.json()

  sys.textContent=j.system_active?"AKTİF":"PASİF"
  sys.className="badge "+(j.system_active?"green":"red")

  market.textContent=j.market_open?"AÇIK":"KAPALI"
  market.className="badge "+(j.market_open?"green":"red")

  if(j.last_scan){
    scan.textContent=new Date(j.last_scan*1000).toLocaleTimeString()
  }

  ALL=j.signals||[]
  render()
}

document.getElementById("filters").addEventListener("change",render)
setInterval(load,5000)
load()
</script>

</body>
</html>
