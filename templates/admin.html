<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>ADMIN PANEL | BIST TRADE</title>

<style>
body{
    margin:0;
    background:#0b0f1a;
    font-family:Segoe UI,Arial;
    color:#e6e6e6;
}

.header{
    background:#0f172a;
    padding:20px 30px;
    font-size:22px;
    font-weight:800;
    letter-spacing:1px;
    border-bottom:1px solid #1e293b;
}

.container{
    padding:30px;
}

.section-title{
    font-size:18px;
    font-weight:700;
    margin:40px 0 15px 0;
}

.table{
    width:100%;
    border-collapse:collapse;
    background:#0f172a;
    border-radius:12px;
    overflow:hidden;
}

.table th{
    background:#111827;
    padding:14px;
    font-size:14px;
    text-align:left;
    border-bottom:1px solid #1e293b;
}

.table td{
    padding:12px;
    font-size:13px;
    border-bottom:1px solid #1e293b;
}

.badge{
    padding:4px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
}

.badge.active{
    background:#14532d;
    color:#22c55e;
}

.badge.expired{
    background:#7f1d1d;
    color:#ef4444;
}

.badge.warning{
    background:#78350f;
    color:#fbbf24;
}

.badge.used{
    background:#7c3aed;
    color:#fff;
}

.badge.unused{
    background:#1e3a8a;
    color:#93c5fd;
}

.action-box{
    display:flex;
    gap:6px;
}

input{
    padding:6px;
    border-radius:8px;
    border:none;
    background:#1f2937;
    color:#fff;
}

input[type=number]{
    width:60px;
}

button{
    padding:6px 10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

.btn-add{
    background:#14532d;
    color:#22c55e;
}

.btn-sub{
    background:#7f1d1d;
    color:#ef4444;
}

.btn-refresh{
    background:#2563eb;
    color:#fff;
    padding:10px 16px;
    margin-bottom:20px;
    border-radius:10px;
    font-size:14px;
}

.btn-generate{
    background:#f59e0b;
    color:#000;
}

.btn-delete{
    background:#7f1d1d;
    color:#fff;
}

.chatid{
    font-size:11px;
    opacity:0.8;
}
</style>
</head>
<body>

<div class="header">
    ⚙️ BIST TRADE ADMIN PANEL
</div>

<div class="container">

<button class="btn-refresh" onclick="loadUsers()">Yenile</button>

<h2 class="section-title">👤 Kullanıcılar</h2>

<table class="table">
<thead>
<tr>
    <th>ID</th>
    <th>Kullanıcı</th>
    <th>Chat ID</th>
    <th>Abonelik Bitiş</th>
    <th>Kalan Gün</th>
    <th>Durum</th>
    <th>İşlem</th>
</tr>
</thead>
<tbody id="userTable"></tbody>
</table>


<h2 class="section-title">🎟️ Davet Kodları</h2>

<div style="margin-bottom:15px;">
    <input type="number" id="codeCount" value="5">
    <input type="number" id="expireDays" placeholder="Geçerlilik Gün (opsiyonel)">
    <button class="btn-generate" onclick="generateCodes()">Kod Üret</button>
</div>

<table class="table">
<thead>
<tr>
    <th>Kod</th>
    <th>Kullanıldı mı</th>
    <th>Kullanan</th>
    <th>Oluşturulma</th>
    <th>Sil</th>
</tr>
</thead>
<tbody id="codeTable"></tbody>
</table>

</div>

<script>

function formatDate(dateStr){
    if(!dateStr) return "-";
    const d=new Date(dateStr);
    return d.toLocaleString("tr-TR");
}

function daysLeft(dateStr){
    if(!dateStr) return 0;
    const now=new Date();
    const end=new Date(dateStr);
    return Math.ceil((end-now)/(1000*60*60*24));
}

function statusBadge(days){
    if(days<=0){
        return `<span class="badge expired">SÜRE BİTTİ</span>`;
    }
    if(days<=1){
        return `<span class="badge warning">1 GÜN</span>`;
    }
    return `<span class="badge active">AKTİF</span>`;
}

async function updateSub(userId, days){
    await fetch("/admin/update-subscription",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ user_id:userId, days:days })
    });
    loadUsers();
}

async function loadUsers(){
    const res=await fetch("/admin/users");
    const users=await res.json();

    const tbody=document.getElementById("userTable");
    tbody.innerHTML="";

    users.forEach(u=>{
        const days=daysLeft(u.subscription_end);

        const tr=document.createElement("tr");

        tr.innerHTML=`
        <td>${u.id}</td>
        <td>${u.username}</td>
        <td class="chatid">${u.telegram_chat_id||"-"}</td>
        <td>${formatDate(u.subscription_end)}</td>
        <td>${days>0?days:0}</td>
        <td>${statusBadge(days)}</td>
        <td>
            <div class="action-box">
                <input type="number" id="days-${u.id}" value="7">
                <button class="btn-add" onclick="updateSub(${u.id}, parseInt(document.getElementById('days-${u.id}').value))">+ Gün</button>
                <button class="btn-sub" onclick="updateSub(${u.id}, -parseInt(document.getElementById('days-${u.id}').value))">- Gün</button>
            </div>
        </td>
        `;
        tbody.appendChild(tr);
    });

    loadCodes();
}

async function generateCodes(){
    const count=document.getElementById("codeCount").value;
    const expireDays=document.getElementById("expireDays").value;

    await fetch("/admin/generate-codes",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            count:count,
            expire_days:expireDays
        })
    });

    loadCodes();
}

async function loadCodes(){
    const res=await fetch("/admin/invite-codes");
    const codes=await res.json();

    const tbody=document.getElementById("codeTable");
    tbody.innerHTML="";

    codes.forEach(c=>{
        const tr=document.createElement("tr");
        tr.innerHTML=`
        <td>${c.code}</td>
        <td>${c.is_used?'<span class="badge used">KULLANILDI</span>':'<span class="badge unused">AKTİF</span>'}</td>
        <td>${c.used_by||"-"}</td>
        <td>${formatDate(c.created_at)}</td>
        <td><button class="btn-delete" onclick="deleteCode('${c.code}')">Sil</button></td>
        `;
        tbody.appendChild(tr);
    });
}

async function deleteCode(code){
    await fetch("/admin/delete-code",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ code:code })
    });
    loadCodes();
}

loadUsers();

</script>
</body>
</html>
