<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Giriş Yap</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#0b0f1a);
    font-family:Segoe UI,Arial;
    color:white;
}

.card{
    background:#111827;
    padding:40px;
    border-radius:16px;
    width:350px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.card h2{
    margin-top:0;
    text-align:center;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    background:#1f2937;
    color:white;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    background:#2563eb;
    color:white;
    font-weight:600;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#1d4ed8;
}

.error{
    text-align:center;
    margin-top:15px;
    color:#f87171;
    font-size:13px;
}
</style>
</head>
<body>

<div class="card">
    <h2>BIST Sinyal Giriş</h2>

    <form method="POST">
        <div class="input-group">
            <input type="text" name="username" placeholder="Kullanıcı Adı" required>
        </div>

        <div class="input-group">
            <input type="password" name="password" placeholder="Şifre" required>
        </div>

        <button type="submit">Giriş Yap</button>
    </form>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
</div>

</body>
</html>
