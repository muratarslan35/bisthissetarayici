<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIST TRADE PANELİ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    height:100%;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url('/static/bist-bg.jpg') center center no-repeat;
    background-size:cover;
    background-attachment:fixed;
    font-family:Segoe UI,Arial;
    position:relative;
}

/* DARK OVERLAY */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.75),rgba(0,0,0,.85));
    z-index:0;
    pointer-events:none;
}

/* LOGIN PANEL */
.login-box{
    position:relative;
    width:360px;
    max-width:90%;
    padding:40px 30px;
    background:rgba(15,23,42,.78);
    backdrop-filter:blur(15px);
    border-radius:18px;
    box-shadow:0 0 40px rgba(0,0,0,.8);
    z-index:2;
}

/* Animated Border */
.login-box::before{
    content:"";
    position:absolute;
    inset:-3px;
    border-radius:20px;
    padding:3px;
    background:linear-gradient(90deg,#00ff88,#ff0000,#00ff88);
    background-size:300% 300%;
    animation:borderMove 4s linear infinite;
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
}

@keyframes borderMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

h1{
    text-align:center;
    color:#ffffff;
    margin-bottom:25px;
    font-size:22px;
    letter-spacing:1px;
}

.input-group{
    margin-bottom:18px;
}

.input-group input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#0f172a;
    color:#fff;
    font-size:14px;
    outline:none;
    transition:.3s;
}

.input-group input:focus{
    box-shadow:0 0 10px #3b82f6;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(90deg,#2563eb,#3b82f6);
    transition:.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(59,130,246,.6);
}

.register-link{
    margin-top:18px;
    text-align:center;
    font-size:13px;
    color:#94a3b8;
}

.register-link a{
    color:#3b82f6;
    text-decoration:none;
}

.register-link a:hover{
    text-decoration:underline;
}
</style>
</head>

<body>

<form class="login-box" method="POST">
    <h1>BIST TRADE PANELİ</h1>

    <div class="input-group">
        <input type="text" name="username" placeholder="Kullanıcı Adı" required autocomplete="off">
    </div>

    <div class="input-group">
        <input type="password" name="password" placeholder="Şifre" required autocomplete="current-password">
    </div>

    <button type="submit">Giriş Yap</button>

    <div class="register-link">
        Hesabın yok mu? <a href="/register">Kayıt Ol</a>
    </div>
</form>

</body>
</html>
