<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Sinyal Dashboard</title>

<style>
/* === MEVCUT CSS AYNEN KORUNDU === */
body {
    margin:0;
    background:#0b0f1a;
    font-family:Segoe UI, Arial;
    color:#e6e6e6;
}

/* TOP STATUS */
.top-status {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 28px;
    background:#0f172a;
    border-bottom:2px solid #1e293b;
    font-size:16px;
}
.status-item span { font-weight:700; margin-left:6px; }

/* FILTER BAR */
.filter-bar {
    display:flex;
    gap:14px;
    padding:18px 28px;
    background:#111827;
    flex-wrap:wrap;
    border-bottom:1px solid #1e293b;
}
.filter-btn {
    background:#1f2937;
    padding:12px 22px;
    border-radius:14px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:.2s;
}
.filter-btn.active { background:#2563eb; }

/* GRID */
.container {
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(420px, 1fr));
    gap:18px;
}

/* CARD */
.card {
    background:#121826;
    border-radius:14px;
    padding:16px;
    border-left:6px solid #64748b;
    box-shadow:0 0 18px rgba(0,0,0,.6);
}

.signal-strong { border-left-color:#22c55e; }
.signal-combo  { border-left-color:#3b82f6; }
.signal-watch  { border-left-color:#facc15; }
.signal-success { border-left-color:#a855f7; }

.signal-title { font-size:13px; font-weight:bold; }
.symbol { font-size:22px; font-weight:bold; margin:6px 0; }
.price { font-size:22px; font-weight:900; margin:6px 0; }

.row { font-size:13px; margin:4px 0; }

.helpers { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
.helper { padding:4px 8px; border-radius:8px; font-size:11px; }
.helper.A { background:#16a34a; }
.helper.B { background:#2563eb; }
.helper.C { background:#ca8a04; }

.history { margin-top:10px; font-size:11px; opacity:.75; }
.time { font-size:11px; opacity:.6; text-align:right; margin-top:8px; }

/* === YENİ RAPOR PANELİ === */
.report-panel {
    background:#0f172a;
    border-radius:14px;
    padding:18px;
    margin:20px;
    display:none;
}
.report-panel h2 { margin-top:0; }
</style>
</head>

<body>

<div class="top-status">
    <div>📊 Piyasa: <span id="market">-</span></div>
    <div>📡 Tarama: <span id="scanner">-</span></div>
    <div>🕒 Saat: <span id="clock">-</span></div>
</div>

<div class="filter-bar">
    <div class="filter-btn active" onclick="setFilter('all',event)">Tümü</div>
    <div class="filter-btn" onclick="setFilter('strong',event)">Güçlü Al</div>
    <div class="filter-btn" onclick="setFilter('power',event)">Güçlenen</div>
    <div class="filter-btn" onclick="setFilter('kombine',event)">Kombine</div>
    <div class="filter-btn" onclick="setFilter('super',event)">Süper Kombine</div>
    <div class="filter-btn" onclick="setFilter('success',event)">Başarılı</div>
    <!-- ✅ YENİ -->
    <div class="filter-btn" onclick="setFilter('weekly',event)">Haftalık Analiz</div>
</div>

<!-- ✅ RAPOR PANELİ -->
<div class="report-panel" id="weeklyPanel"></div>

<div class="container" id="signals"></div>

<script>
let CURRENT_FILTER="all";

function setFilter(f,e){
    CURRENT_FILTER=f;
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    e.target.classList.add("active");
    loadSignals();
}

function matchFilter(s){
    if(CURRENT_FILTER==="weekly") return false;
    if(CURRENT_FILTER==="all") return true;
    if(CURRENT_FILTER==="strong") return s.action==="GÜÇLÜ AL";
    if(CURRENT_FILTER==="power") return s.power_delta>=20;
    if(CURRENT_FILTER==="kombine") return s.main_algorithm==="KOMBİNE";
    if(CURRENT_FILTER==="super") return s.main_algorithm==="SÜPER KOMBİNE";
    if(CURRENT_FILTER==="success") return s.category==="success";
    return true;
}

async function loadSignals(){
    const res = await fetch("/api/dashboard");
    const data = await res.json();

    market.innerText=data.market_open?"AÇIK":"KAPALI";
    scanner.innerText=data.system_active?"AKTİF":"PASİF";
    clock.innerText=data.server_time;

    const box=document.getElementById("signals");
    const weekly=document.getElementById("weeklyPanel");

    box.innerHTML="";
    weekly.style.display="none";

    /* === HAFTALIK ANALİZ === */
    if(CURRENT_FILTER==="weekly"){
        weekly.style.display="block";
        weekly.innerHTML=`
            <h2>📅 Haftalık Başarı Analizi</h2>
            <p>Hafta: ${data.weekly_report?.week_id ?? "-"}</p>

            <h3>✅ Başarılı Sinyaller</h3>
            ${(data.weekly_report?.success_signals||[]).map(s=>
                `<div>• ${s.symbol} (${s.hit_day}) → %${s.gain_pct}</div>`
            ).join("") || "Yok"}

            <h3>❌ Hedefe Ulaşamayanlar</h3>
            ${(data.weekly_report?.failed_signals||[]).join(", ") || "Yok"}
        `;
        return;
    }

    /* === NORMAL KARTLAR === */
    data.signals.filter(matchFilter).forEach(s=>{
        const c=document.createElement("div");
        c.className=`card signal-${s.category}`;
        c.innerHTML=`
            <div class="signal-title">${s.title??""}</div>
            <div class="symbol">${s.symbol}</div>
            ${s.entry_price?`<div class="row">🎯 Giriş: ${s.entry_price}</div>`:""}
            <div class="price">💰 ${s.price??"-"}</div>
            <div class="row">⚡ ${s.action} | ${s.main_algorithm}</div>
            <div class="history">
                ${(s.history||[]).slice(-3).map(h=>`${h[0]} → ${h[1]}`).join("<br>")}
            </div>
            <div class="time">${s.time}</div>
        `;
        box.appendChild(c);
    });
}

setInterval(loadSignals,10000);
loadSignals();
</script>

</body>
</html>
