<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Sinyal Dashboard</title>

<style>
body {
    margin:0;
    background:#0b0f1a;
    font-family:Segoe UI, Arial;
    color:#e6e6e6;
}

/* ================= TOP STATUS ================= */
.top-status {
    display:flex;
    justify-content:space-between;
    padding:16px 24px;
    background:#0f172a;
    border-bottom:1px solid #1e293b;
}
.status-item span { font-weight:bold; }

/* ================= FILTER BAR ================= */
.filter-bar {
    display:flex;
    gap:10px;
    padding:14px 24px;
    background:#111827;
    border-bottom:1px solid #1e293b;
}
.filter-btn {
    background:#1f2937;
    padding:10px 18px;
    border-radius:12px;
    cursor:pointer;
    font-size:14px;
}
.filter-btn.active { background:#2563eb; }

/* ================= GRID ================= */
.container {
    padding:22px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
    gap:20px;
}

/* ================= CARD ================= */
.card {
    position: relative;
    background: linear-gradient(180deg, #121826, #0f1524);
    border-radius: 16px;
    padding: 18px 18px 16px 26px;
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 12px 32px rgba(0,0,0,.65);
    overflow: hidden;
}

.card::before {
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:12px;
    background:#475569;
}

.signal-strong::before { background:#dc2626; }
.signal-combo::before { background:#2563eb; }
.signal-watch::before { background:#f59e0b; }
.signal-success::before { background:#a855f7; }

.signal-title { font-size:13px; font-weight:700; opacity:.85; }
.symbol { font-size:24px; font-weight:900; margin:6px 0; }
.price { font-size:22px; font-weight:800; margin-top:4px; }
.row { font-size:13px; margin-top:6px; line-height:1.45; }

.block {
    margin-top:10px;
    padding:10px 12px;
    background:rgba(255,255,255,0.05);
    border-radius:12px;
    font-size:13px;
}

/* ================= TP ================= */
.tp-box {
    margin-top:10px;
    padding:10px 12px;
    background:rgba(16,185,129,0.08);
    border:1px solid rgba(16,185,129,0.25);
    border-radius:12px;
    font-size:13px;
}
.tp-row {
    display:flex;
    justify-content:space-between;
    margin-top:4px;
}
.tp-price {
    font-weight:800;
    color:#10b981;
}

.history {
    font-size:11px;
    opacity:.75;
    margin-top:10px;
    line-height:1.45;
}

.time {
    font-size:11px;
    opacity:.6;
    text-align:right;
    margin-top:8px;
}

/* ================= CHIPS ================= */
.helper-chip {
    display:inline-block;
    padding:3px 8px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    margin-top:4px;
}
.helper-chip.a { background:#14532d; color:#22c55e; }
.helper-chip.b { background:#1e3a8a; color:#93c5fd; }
.helper-chip.c { background:#78350f; color:#fbbf24; }

/* ================= WEEKLY TABLE ================= */
#weekly-section {
    display:none;
    padding:22px;
}

#weekly-table {
    width:100%;
    border-collapse:collapse;
    background:#0f172a;
    border-radius:12px;
    overflow:hidden;
    font-size:13px;
}

#weekly-table th,
#weekly-table td {
    padding:10px 8px;
    border-bottom:1px solid #1e293b;
    text-align:left;
}

.weekly-success { color:#22c55e; }
.weekly-failed { color:#ef4444; }
/* ================= REAL STOCK ARROWS ================= */
.stock-arrow {
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    font-size:13px;
}

.stock-arrow.up {
    color:#16a34a; /* borsa yeşili */
}

.stock-arrow.down {
    color:#dc2626; /* borsa kırmızısı */
}

.stock-arrow.up::before {
    content:"";
    width:0;
    height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-bottom:10px solid #16a34a;
}

.stock-arrow.down::before {
    content:"";
    width:0;
    height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-top:10px solid #dc2626;
}
    
</style>
</head>
<body>

<div class="top-status">
    <div class="status-item">📊 Piyasa: <span id="market">-</span></div>
    <div class="status-item">📡 Tarama: <span id="scanner">-</span></div>
    <div class="status-item">🕒 Saat: <span id="clock">-</span></div>
</div>

<div class="filter-bar">
    <div class="filter-btn active" onclick="setFilter('all',event)">Tümü</div>
    <div class="filter-btn" onclick="setFilter('strong',event)">Güçlü Al</div>
    <div class="filter-btn" onclick="setFilter('power',event)">Güçlenen</div>
    <div class="filter-btn" onclick="setFilter('kombine',event)">Kombine</div>
    <div class="filter-btn" onclick="setFilter('super',event)">Süper Kombine</div>
    <div class="filter-btn" onclick="setFilter('success',event)">Günlük Başarı</div>
    <div class="filter-btn" onclick="setFilter('weekly',event)">Haftalık Başarı</div>
</div>

<div class="container" id="signals"></div>

<div id="weekly-section">
    <h2>📅 Haftalık Performans</h2>
    <div id="weekly-summary"></div>

    <table id="weekly-table">
        <thead>
            <tr>
                <th>Hisse</th>
                <th>Algoritma</th>
                <th>Giriş</th>
                <th>Canlı Fiyat</th>
                <th>Gün / Saat</th>
                <th>Güncel Getiri %</th>
                <th>Süre</th>
                <th>Yardımcılar</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
const market  = document.getElementById("market");
const scanner = document.getElementById("scanner");
const clock   = document.getElementById("clock");
    
let CURRENT_FILTER="all";

function hourChip(time)
    if(!time) return "c";
    const h=parseInt(time.split(":")[0]);
    if(h>=10 && h<=11) return "a";
    if(h>=12 && h<=14) return "b";
    return "c";
}
function matchFilter(s){
    /* TÜMÜ */
    if (CURRENT_FILTER === "all") return true;

    /* GÜÇLÜ AL (zayıflayanlar hariç) */
    if (CURRENT_FILTER === "strong")
        return s.action === "GÜÇLÜ AL" && s.weakened !== true;

    /* GÜÇLENEN */
    if (CURRENT_FILTER === "power")
        return (s.power_delta || 0) >= 20 && s.weakened !== true;

    /* KOMBİNE */
    if (CURRENT_FILTER === "kombine")
        return s.main_algorithm === "KOMBİNE";

    /* SÜPER KOMBİNE */
    if (CURRENT_FILTER === "super")
        return s.main_algorithm === "SÜPER KOMBİNE";

    /* GÜNLÜK BAŞARILI */
    if (CURRENT_FILTER === "success")
        return s.category === "success";

    return true;
    }

function setFilter(f,e){
    CURRENT_FILTER=f;
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    e.target.classList.add("active");
    loadSignals();
}

async function loadSignals(){
    const res = await fetch("/api/dashboard");
    const data = await res.json();

    market.innerText=data.market_open?"AÇIK":"KAPALI";
    scanner.innerText=data.system_active?"AKTİF":"PASİF";
    clock.innerText=data.server_time;

    const box=document.getElementById("signals");
    const weekly=document.getElementById("weekly-section");
    const tbody=document.querySelector("#weekly-table tbody");
    const summary=document.getElementById("weekly-summary");

    box.innerHTML="";
    tbody.innerHTML="";

    if(CURRENT_FILTER==="weekly"){
        box.style.display="none";
        weekly.style.display="block";

        const wt=data.weekly_table;
        if(wt){
            summary.innerHTML=`📡 ${wt.summary.total} | ✅ ${wt.summary.success} | ❌ ${wt.summary.failed}`;

            [...wt.success,...wt.failed].forEach(r=>{
                const tr=document.createElement("tr");
                tr.className=r.gain_pct>=0?"weekly-success":"weekly-failed";
                tr.innerHTML=`
                    <td>${r.symbol}</td>
                    <td>${r.algorithm}</td>
                    <td>${r.entry_price ?? "-"}</td>
                    <td>${r.current_price ?? "-"}</td>
                    <td>
                        ${r.entry_day ?? "-"}<br>
                        <span class="helper-chip ${hourChip(r.entry_time)}">
                            ${r.entry_time ?? ""}
                        </span>
                    </td>
                    <td>
${r.gain_pct !== null ? `
  <span class="stock-arrow ${r.gain_pct >= 0 ? 'up' : 'down'}">
    ${r.gain_pct}%
  </span>
` : "-"}
</td>
                    <td>
                        ${r.duration_label
                            ? `<span class="helper-chip a">${r.duration_label}</span>`
                            : `<span class="helper-chip c">Açık</span>`}
                    </td>
                    <td>${(r.helpers||[]).join(", ")}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        return;
}

    weekly.style.display = "none";
box.style.display = "grid";

(data.signals || []).filter(matchFilter).forEach(s => {
    const price = parseFloat(s.price);
    const entry = parseFloat(s.entry_price || price);

    const tp1 = (entry * 1.015).toFixed(2);
    const tp2 = (entry * 1.03).toFixed(2);
    const tp3 = (entry * 1.05).toFixed(2);

    const visualCategory =
        s.category === "success" ? "success" :
        s.action === "GÜÇLÜ AL" ? "strong" :
        (s.main_algorithm === "KOMBİNE" || s.main_algorithm === "SÜPER KOMBİNE") ? "combo" :
        s.weakened === true ? "watch" :
        "watch";

    const c = document.createElement("div");
    c.className = `card signal-${visualCategory}`;

    c.innerHTML = `
        <div class="signal-title">${s.title || ""}</div>
        <div class="symbol">${s.symbol}</div>

        ${s.entry_price ? `<div class="row">🎯 Giriş: ${s.entry_price}</div>` : ""}

        <div class="price">💰 ${s.price}</div>

        ${s.live_gain_pct !== null && s.live_gain_pct !== undefined ? `
        <div class="row">
            📊 Canlı:
            <span class="stock-arrow ${s.live_gain_pct >= 0 ? 'up' : 'down'}">
                ${s.live_gain_pct}%
            </span>
        </div>` : ""}

        <div class="row">⚡ ${s.action} | ${s.main_algorithm}</div>

        ${s.resistance_1h ? `<div class="row">🧱 1H Direnç: ${s.resistance_1h} (%${s.resistance_1h_pct})</div>` : ""}
        ${s.resistance_4h ? `<div class="row">🧱 4H Direnç: ${s.resistance_4h} (%${s.resistance_4h_pct})</div>` : ""}

        ${(s.most_1h || s.most_4h) ? `
        <div class="block">
            🧭 MOST<br>
            ${s.most_1h ? `1H: ${s.most_1h === "UP" ? "⬆️" : "⬇️"} (${s.most_1h_level})<br>` : ""}
            ${s.most_4h ? `4H: ${s.most_4h === "UP" ? "⬆️" : "⬇️"} (${s.most_4h_level})` : ""}
        </div>` : ""}

        <div class="tp-box">
            <div class="tp-row"><div>TP1 %1.5</div><div class="tp-price">${tp1}</div></div>
            <div class="tp-row"><div>TP2 %3</div><div class="tp-price">${tp2}</div></div>
            <div class="tp-row"><div>TP3 %5</div><div class="tp-price">${tp3}</div></div>
        </div>

        ${(s.helpers && s.helpers.length) ? `
        <div class="block">🧩 Yardımcılar:<br>${s.helpers.map(h => `• ${h}`).join("<br>")}</div>` : ""}

        ${(s.history && s.history.length) ? `
        <div class="history">${s.history.slice(-4).map(h => `${h[0]} → ${h[1]}`).join("<br>")}</div>` : ""}

        <div class="time">${s.time}</div>
    `;

    box.appendChild(c);
});

setInterval(loadSignals,10000);
loadSignals();
</script>

</body>
</html>
