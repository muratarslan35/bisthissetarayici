<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Sinyal Dashboard</title>

<style>
body {
    margin:0;
    background:#0b0f1a;
    font-family:Segoe UI, Arial;
    color:#e6e6e6;
}

.top-status {
    display:flex;
    justify-content:space-between;
    padding:16px 24px;
    background:#0f172a;
    border-bottom:1px solid #1e293b;
}
.status-item span { font-weight:bold; }

.filter-bar {
    display:flex;
    gap:10px;
    padding:14px 24px;
    background:#111827;
    border-bottom:1px solid #1e293b;
}
.filter-btn {
    background:#1f2937;
    padding:10px 18px;
    border-radius:12px;
    cursor:pointer;
    font-size:14px;
}
.filter-btn.active { background:#2563eb; }

.container {
    padding:22px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
    gap:20px;
}

.card {
    position: relative;
    background: linear-gradient(180deg, #121826, #0f1524);
    border-radius: 16px;
    padding: 18px 18px 16px 26px;
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 12px 32px rgba(0,0,0,.65);
    overflow: hidden;
    transition: all .25s ease;
}

.card:hover {
    transform: translateY(-3px);
}

.card.reentry:hover {
    box-shadow:
        0 0 0 1px rgba(251,191,36,0.6),
        0 0 26px rgba(251,191,36,0.35);
}

.card::before {
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:12px;
    background:#475569;
}

.signal-strong::before { background:#dc2626; }
.signal-combo::before { background:#2563eb; }
.signal-watch::before { background:#f59e0b; }
.signal-success::before { background:#a855f7; }

.signal-title {
    font-size:13px;
    font-weight:800;
}
.signal-title.reentry-title { color:#fbbf24; }

.symbol { font-size:24px; font-weight:900; margin:6px 0; }
.price { font-size:22px; font-weight:800; margin-top:4px; }
.row { font-size:13px; margin-top:6px; line-height:1.45; }

.history {
    font-size:11px;
    opacity:.75;
    margin-top:10px;
}

.time {
    font-size:11px;
    opacity:.6;
    text-align:right;
    margin-top:8px;
}

.helper-chip {
    display:inline-block;
    padding:3px 8px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    margin-right:4px;
    margin-top:4px;
}
.helper-chip.a { background:#14532d; color:#22c55e; }
.helper-chip.b { background:#1e3a8a; color:#93c5fd; }
.helper-chip.c { background:#78350f; color:#fbbf24; }
.helper-chip.re { background:#f59e0b; color:#000; }

.tp-box {
    margin-top:10px;
    padding:10px;
    background:rgba(16,185,129,0.08);
    border:1px solid rgba(16,185,129,0.25);
    border-radius:12px;
    font-size:13px;
}
.tp-row {
    display:flex;
    justify-content:space-between;
}

#weekly-section { display:none; padding:22px; }

#weekly-table {
    width:100%;
    border-collapse:collapse;
    background:#0f172a;
    font-size:13px;
}
#weekly-table th, #weekly-table td {
    padding:10px;
    border-bottom:1px solid #1e293b;
}
</style>
</head>

<body>

<div class="top-status">
    <div class="status-item">📊 Piyasa: <span id="market">-</span></div>
    <div class="status-item">📡 Tarama: <span id="scanner">-</span></div>
    <div class="status-item">🕒 Saat: <span id="clock">-</span></div>
</div>

<div class="filter-bar">
    <div class="filter-btn active" onclick="setFilter('all',event)">Tümü</div>
    <div class="filter-btn" onclick="setFilter('strong',event)">Güçlü Al</div>
    <div class="filter-btn" onclick="setFilter('power',event)">Güçlenen</div>
    <div class="filter-btn" onclick="setFilter('kombine',event)">Kombine</div>
    <div class="filter-btn" onclick="setFilter('super',event)">Süper Kombine</div>
    <div class="filter-btn" onclick="setFilter('success',event)">Günlük Başarı</div>
    <div class="filter-btn" onclick="setFilter('weekly',event)">Haftalık Başarı</div>
</div>

<div class="container" id="signals"></div>

<div id="weekly-section">
    <h2>📅 Haftalık Performans</h2>
    <div id="weekly-summary"></div>
    <table id="weekly-table">
        <thead>
            <tr>
                <th>Hisse</th>
                <th>Algoritma</th>
                <th>Giriş</th>
                <th>Canlı</th>
                <th>Satış</th>
                <th>Satış %</th>
                <th>Canlı %</th>
                <th>Gün</th>
                <th>Süre</th>
                <th>Yardımcılar</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
let CURRENT_FILTER = "all";

function hourChip(time){
    if(!time) return "c";
    const h = parseInt(time.split(":")[0]);
    if(h >= 10 && h <= 11) return "a";
    if(h >= 12 && h <= 14) return "b";
    return "c";
}

function setFilter(f,e){
    CURRENT_FILTER = f;
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    e.target.classList.add("active");
    loadSignals();
}

function matchFilter(s){
    if(CURRENT_FILTER==="all") return true;
    if(CURRENT_FILTER==="strong") return s.action==="GÜÇLÜ AL" && s.signal_type!=="reentry";
    if(CURRENT_FILTER==="power") return (s.power_delta||0)>=20;
    if(CURRENT_FILTER==="kombine") return s.main_algorithm==="KOMBİNE";
    if(CURRENT_FILTER==="super") return s.main_algorithm==="SÜPER KOMBİNE";
    if(CURRENT_FILTER==="success") return s.category==="success";
    return true;
}

async function loadSignals(){
    const res = await fetch("/api/dashboard");
    const data = await res.json();

    market.innerText = data.market_open?"AÇIK":"KAPALI";
    scanner.innerText = data.system_active?"AKTİF":"PASİF";
    clock.innerText = data.server_time;

    const box=document.getElementById("signals");
    const weekly=document.getElementById("weekly-section");
    const tbody=document.querySelector("#weekly-table tbody");

    box.innerHTML="";
    tbody.innerHTML="";

    if(CURRENT_FILTER==="weekly"){
        weekly.style.display="block";
        box.style.display="none";
        const wt=data.weekly_table;
        if(wt){
            document.getElementById("weekly-summary").innerText=
                `Toplam ${wt.summary.total} | ✅ ${wt.summary.success} | ❌ ${wt.summary.failed}`;
            [...wt.success,...wt.failed].forEach(r=>{
                if(r.signal_type==="reentry") return;
                const tr=document.createElement("tr");
                tr.innerHTML=`
<td>${r.symbol}</td>
<td>${r.algorithm}</td>
<td>${r.entry_price??"-"}</td>
<td>${r.current_price??"-"}</td>
<td>${r.sell_price??"-"}</td>
<td>${r.sell_gain_pct??"-"}</td>
<td>${r.live_gain_pct??"-"}</td>
<td>${r.entry_day??"-"}</td>
<td>${r.duration_label??"-"}</td>
<td>${(r.helpers||[]).join(", ")}</td>`;
                tbody.appendChild(tr);
            });
        }
        return;
    }

    weekly.style.display="none";
    box.style.display="grid";

    (data.signals||[]).filter(matchFilter).forEach(s=>{
        const c=document.createElement("div");
        const cls=s.category==="success"?"success":(s.action==="GÜÇLÜ AL"?"strong":"watch");
        c.className=`card signal-${cls} ${s.signal_type==="reentry"?"reentry":""}`;

        c.innerHTML=`
<div class="signal-title ${s.signal_type==="reentry"?"reentry-title":""}">
${s.signal_type==="reentry"?"♻️ TEKRAR GÜÇLÜ AL":s.title}
</div>

<div class="symbol">
${s.symbol}
${s.signal_type==="reentry"?'<span class="helper-chip re">RE</span>':""}
</div>

${s.entry_price?`<div class="row">🎯 Giriş: ${s.entry_price}</div>`:""}
<div class="price">💰 ${s.price}</div>
<div class="row">⚡ ${s.action} | ${s.main_algorithm}</div>

${s.tp1?`
<div class="tp-box">
<div class="tp-row">TP1 <b>${s.tp1}</b></div>
<div class="tp-row">TP2 <b>${s.tp2}</b></div>
<div class="tp-row">TP3 <b>${s.tp3}</b></div>
</div>`:""}

${s.helpers_detail?`
<div class="row">
${s.helpers_detail.map(h=>`<span class="helper-chip ${h.level.toLowerCase()}">${h.name}</span>`).join("")}
</div>`:""}

${s.history?`<div class="history">${s.history.slice(-4).map(h=>`${h[0]} → ${h[1]}`).join("<br>")}</div>`:""}

<div class="time">
<span class="helper-chip ${hourChip(s.time)}">${s.time}</span>
</div>`;
        box.appendChild(c);
    });
}

loadSignals();
setInterval(loadSignals,10000);
</script>
</body>
</html>
