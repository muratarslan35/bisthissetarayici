<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST Sinyal Dashboard</title>

<style>
body {
    margin:0;
    background:#0b0f1a;
    font-family:Segoe UI, Arial;
    color:#e6e6e6;
}

/* ================= TOP STATUS ================= */
.top-status {
    display:flex;
    justify-content:space-between;
    padding:16px 24px;
    background:#0f172a;
    border-bottom:1px solid #1e293b;
}
.status-item span { font-weight:bold; }

/* ================= FILTER BAR ================= */
.filter-bar {
    display:flex;
    gap:10px;
    padding:14px 24px;
    background:#111827;
    border-bottom:1px solid #1e293b;
}
.filter-btn {
    background:#1f2937;
    padding:10px 18px;
    border-radius:12px;
    cursor:pointer;
    font-size:14px;
}
.filter-btn.active { background:#2563eb; }

/* ================= GRID ================= */
.container {
    padding:22px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(420px,1fr));
    gap:20px;
}

/* ================= CARD ================= */
.card {
    position: relative;
    background: linear-gradient(180deg, #121826, #0f1524);
    border-radius: 16px;
    padding: 18px 18px 16px 26px;
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 12px 32px rgba(0,0,0,.65);
    overflow: hidden;
}

/* SOL BAR */
.card::before {
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:12px;
    background:#475569;
}

.signal-strong::before {
    background: linear-gradient(180deg,#dc2626,#7f1d1d);
    box-shadow: 0 0 22px rgba(220,38,38,.65);
}
.signal-combo::before {
    background: linear-gradient(180deg,#2563eb,#1e3a8a);
}
.signal-watch::before {
    background: linear-gradient(180deg,#f59e0b,#92400e);
}
.signal-success::before {
    background: linear-gradient(180deg,#a855f7,#6b21a8);
    box-shadow: 0 0 20px rgba(168,85,247,.55);
}

.signal-title { font-size:13px; font-weight:700; opacity:.85; }
.symbol { font-size:24px; font-weight:900; margin:6px 0; }
.price { font-size:22px; font-weight:800; margin-top:4px; }

.row { font-size:13px; margin-top:6px; line-height:1.45; }

.block {
    margin-top:10px;
    padding:10px 12px;
    background:rgba(255,255,255,0.05);
    border-radius:12px;
    font-size:13px;
}

.history {
    font-size:11px;
    opacity:.75;
    margin-top:10px;
    line-height:1.45;
}

.time {
    font-size:11px;
    opacity:.6;
    text-align:right;
    margin-top:8px;
}

/* ================= TRADINGVIEW HOVER ================= */
.tv-link {
    position:absolute;
    top:14px;
    right:14px;
    font-size:16px;
    cursor:pointer;
}

.tv-hover {
    display:none;
    position:absolute;
    top:36px;
    right:0;
    width:360px;
    height:220px;
    background:#000;
    border-radius:12px;
    overflow:hidden;
    z-index:20;
    box-shadow:0 10px 30px rgba(0,0,0,.8);
}

.tv-link:hover .tv-hover {
    display:block;
}
</style>
</head>

<body>

<div class="top-status">
    <div class="status-item">📊 Piyasa: <span id="market">-</span></div>
    <div class="status-item">📡 Tarama: <span id="scanner">-</span></div>
    <div class="status-item">🕒 Saat: <span id="clock">-</span></div>
</div>

<div class="filter-bar">
    <div class="filter-btn active" onclick="setFilter('all',event)">Tümü</div>
    <div class="filter-btn" onclick="setFilter('strong',event)">Güçlü Al</div>
    <div class="filter-btn" onclick="setFilter('power',event)">Güçlenen</div>
    <div class="filter-btn" onclick="setFilter('kombine',event)">Kombine</div>
    <div class="filter-btn" onclick="setFilter('super',event)">Süper Kombine</div>
    <div class="filter-btn" onclick="setFilter('success',event)">Başarılı</div>
    <div class="filter-btn" onclick="setFilter('weekly',event)">Haftalık</div>
</div>

<div class="container" id="signals"></div>

<script>
let CURRENT_FILTER="all";

function setFilter(f,e){
    CURRENT_FILTER=f;
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    e.target.classList.add("active");
    loadSignals();
}

function matchFilter(s){
    if(CURRENT_FILTER==="weekly") return false;
    if(CURRENT_FILTER==="all") return true;
    if(CURRENT_FILTER==="strong") return s.action==="GÜÇLÜ AL";
    if(CURRENT_FILTER==="power") return (s.power_delta||0)>=20;
    if(CURRENT_FILTER==="kombine") return s.main_algorithm==="KOMBİNE";
    if(CURRENT_FILTER==="super") return s.main_algorithm==="SÜPER KOMBİNE";
    if(CURRENT_FILTER==="success") return s.category==="success";
    return true;
}

function pctRemain(price, level){
    return (((level-price)/price)*100).toFixed(2);
}

async function loadSignals(){
    const res = await fetch("/api/dashboard");
    const data = await res.json();

    market.innerText=data.market_open?"AÇIK":"KAPALI";
    scanner.innerText=data.system_active?"AKTİF":"PASİF";
    clock.innerText=data.server_time;

    const box=document.getElementById("signals");
    box.innerHTML="";

    (data.signals||[]).filter(matchFilter).forEach(s=>{
        const price=parseFloat(s.price);
        const entry=parseFloat(s.entry_price||price);
        const tp1=(entry*1.015).toFixed(2);
        const tp2=(entry*1.03).toFixed(2);
        const tp3=(entry*1.05).toFixed(2);

        const tvSymbol = s.symbol.replace(".IS","");

        const c=document.createElement("div");
        c.className=`card signal-${s.category||"watch"}`;
        c.innerHTML=`
            <div class="tv-link">
                📈
                <div class="tv-hover">
                    <iframe src="https://www.tradingview.com/widgetembed/?symbol=BIST:${tvSymbol}&interval=240&theme=dark&style=1"
                        width="100%" height="100%" frameborder="0"></iframe>
                </div>
            </div>

            <div class="signal-title">${s.title||""}</div>
            <div class="symbol">${s.symbol}</div>

            ${s.entry_price?`<div class="row">🎯 Giriş: ${s.entry_price}</div>`:""}
            <div class="price">💰 ${s.price}</div>

            <div class="row">⚡ ${s.action} | ${s.main_algorithm}</div>

            ${s.resistance_1h?`<div class="row">🧱 1H Direnç: ${s.resistance_1h} (%${pctRemain(price,s.resistance_1h)} kalan)</div>`:""}
            ${s.resistance_4h?`<div class="row">🧱 4H Direnç: ${s.resistance_4h} (%${pctRemain(price,s.resistance_4h)} kalan)</div>`:""}

            <div class="block">
                🎯 TP1 (%1.5): ${tp1}<br>
                🎯 TP2 (%3): ${tp2}<br>
                🎯 TP3 (%5): ${tp3}
            </div>

            ${(s.most_1h||s.most_4h)?`
            <div class="block">
                🧭 MOST:<br>
                ${s.most_1h?`1H: ${s.most_1h==="UP"?"⬆️":"⬇️"}`:""}<br>
                ${s.most_4h?`4H: ${s.most_4h==="UP"?"⬆️":"⬇️"}`:""}
            </div>`:""}

            <div class="history">
                ${(s.history||[]).slice(-3).map(h=>`${h[0]} → ${h[1]}`).join("<br>")}
            </div>

            <div class="time">${s.time}</div>
        `;
        box.appendChild(c);
    });
}

setInterval(loadSignals,10000);
loadSignals();
</script>

</body>
</html>
